version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    secrets:
      - clickhouse_password
    networks:
      - langfuse-internal
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    restart: unless-stopped
    command: redis-server --requirepass-file /run/secrets/redis_password --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - langfuse-redis-data:/data
    secrets:
      - redis_password
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-17T00-11-04Z
    container_name: langfuse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - langfuse-minio-data:/data
    secrets:
      - minio_root_user
      - minio_root_password
    networks:
      - langfuse-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-web:
    image: langfuse/langfuse:3-latest
    container_name: langfuse-web
    restart: unless-stopped
    command: ["web"]
    environment:
      DATABASE_URL: postgresql://langfuse:FILE:/run/secrets/postgres_password@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      REDIS_URL: redis://:FILE:/run/secrets/redis_password@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID_FILE: /run/secrets/minio_root_user
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_root_password
      S3_BUCKET: langfuse
      S3_REGION: us-east-1
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
      NEXTAUTH_URL: http://langfuse.pxbt.app
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      TELEMETRY_ENABLED: "false"
    volumes:
      - langfuse-web-uploads:/app/public/uploads
    secrets:
      - postgres_password
      - clickhouse_password
      - redis_password
      - minio_root_user
      - minio_root_password
      - nextauth_secret
    networks:
      - langfuse-internal
      - langfuse-edge
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  langfuse-worker:
    image: langfuse/langfuse:3-latest
    container_name: langfuse-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql://langfuse:FILE:/run/secrets/postgres_password@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      REDIS_URL: redis://:FILE:/run/secrets/redis_password@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID_FILE: /run/secrets/minio_root_user
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_root_password
      S3_BUCKET: langfuse
      S3_REGION: us-east-1
      NODE_ENV: production
      TELEMETRY_ENABLED: "false"
    secrets:
      - postgres_password
      - clickhouse_password
      - redis_password
      - minio_root_user
      - minio_root_password
    networks:
      - langfuse-internal
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  langfuse-postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/c/dockerlocal/langfuse/postgres
  langfuse-clickhouse-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/c/dockerlocal/langfuse/clickhouse
  langfuse-redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/c/dockerlocal/langfuse/redis
  langfuse-minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/c/dockerlocal/langfuse/minio
  langfuse-web-uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/c/dockerlocal/langfuse/web-uploads

networks:
  langfuse-internal:
    internal: true
  langfuse-edge:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  clickhouse_password:
    file: ./secrets/clickhouse_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  nextauth_secret:
    file: ./secrets/nextauth_secret.txt