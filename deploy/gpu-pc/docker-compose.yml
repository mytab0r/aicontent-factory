services:
  ace-step:
    build: ./deploy/gpu-pc
    image: ace-step-cu128:local
    container_name: ace-step
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:7865:7865"   # только localhost хоста; наружу — Tailscale-сеть самой машины
    volumes:
      - ./ace-data/checkpoints:/app/checkpoints   # модель ~8 GB, качается один раз
      - ./ace-data/outputs:/app/outputs
      - ./ace-data/logs:/app/logs
    environment:
      - ACE_OUTPUT_DIR=/app/outputs
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
