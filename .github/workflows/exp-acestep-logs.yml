name: exp ace-step logs (t_ffa7ff01, read-only)
on:
  push:
    branches: ["exp/acestep-logs"]
permissions:
  contents: read
concurrency:
  group: exp-acestep-logs
jobs:
  logs:
    runs-on: [self-hosted, pc]
    timeout-minutes: 10
    steps:
      - name: endpoint probe + name resolution
        run: |
          getent hosts ace-step || echo "no dns"
          grep -i ace /etc/hosts || echo "no hosts entry"
          curl -s -m 8 -o /dev/null -w 'root=%{http_code}\n' http://ace-step:8001/ || echo "root fail"
          curl -s -m 8 -o /dev/null -w 'health=%{http_code}\n' http://ace-step:8001/health || true
          docker network ls --format '{{.Name}}' | head -8
