name: exp ace-step logs (t_ffa7ff01, read-only)
on:
  push:
    branches: ["exp/acestep-logs"]
permissions:
  contents: read
concurrency:
  group: exp-acestep-logs
jobs:
  logs:
    runs-on: [self-hosted, release]
    timeout-minutes: 10
    steps:
      - name: identify host + ace-step presence
        run: |
          echo "hostname=$(hostname) user=$(whoami)"
          nvidia-smi -L 2>&1 | head -3
          docker ps -a --format '{{.Names}} {{.Status}}' | head -10
