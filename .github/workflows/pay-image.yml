name: pay-image
# ghcr.io/mytab0r/pay-pxbt:latest — только после зелёного ci на master; Watchtower на VPS подтянет.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master, main]
jobs:
  build-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, pc]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      # root-cause: t_0deb6ad8 -- daemon-side `docker login` ping of ghcr.io/v2 times out (~15s, no retry)
      # behind Docker Desktop proxy; creds go to a per-job DOCKER_CONFIG, buildx sends them client-side.
      - name: ghcr auth (client-side config, no daemon ping)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"; echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$d/config.json"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pay-page/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pay-pxbt:latest
            ghcr.io/${{ github.repository_owner }}/pay-pxbt:sha-${{ github.event.workflow_run.head_sha }}
