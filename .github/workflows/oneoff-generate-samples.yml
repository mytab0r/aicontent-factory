name: oneoff-minimax-spike
on:
  workflow_dispatch: {}

# спайк t_737ca0ec: MiniMax Music 3 (форк audio.cpp) vs ACE-Step 1.5 turbo на RTX 5070 12GB.
# ace-step останавливается только на время генерации MiniMax (VRAM 12GB не делится), всегда поднимается обратно.
# Повторный запуск продолжает: веса в volume minimax-weights, готовые треки пропускаются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spike:
    runs-on: [self-hosted, pc]
    timeout-minutes: 300
    env:
      ACE15_ENDPOINT: http://ace-step:8001
    steps:
      - uses: actions/checkout@v4

      - name: Disk gate (веса+образ ~20 GB на vhdx)
        run: bash deploy/gpu-pc/disk_gate.sh 20 /opt/data

      - name: Build minimax image (audio.cpp fork, sm_120)
        run: docker build -f deploy/gpu-pc/minimax/Dockerfile -t minimax-spike:local deploy/gpu-pc/minimax

      - name: Weights via disk_gate volume (audio-cpp/MiniMax-Music3-GGUF, q4_k микс ~9.2 GB)
        run: |
          docker volume create minimax-weights >/dev/null
          docker run --rm -v minimax-weights:/w -w /w -e HF_HUB_DISABLE_TELEMETRY=1 python:3.11-slim sh -c '
            pip install -q "huggingface_hub>=0.34" 2>/dev/null
            hf download audio-cpp/MiniMax-Music3-GGUF \
              --include "language_model_q4_k.gguf" "transformer_q4_k.gguf" "rvq_depth_decoder_q8_0.gguf" \
                        "condition_encoder.gguf" "vocoder.gguf" "config.json" "config/*" "tokenizer/*" \
              --local-dir /w
            ls -la /w'

      - name: ACE-Step down (освободить VRAM)
        run: docker stop ace-step

      # DooD: bind-mount $PWD уходит на хост, где работы раннера нет — файлы только через docker cp.
      - name: Generate MiniMax (10 треков)
        if: always()
        run: |
          rm -rf spike-out && mkdir -p spike-out
          docker rm -f mm3gen >/dev/null 2>&1 || true
          docker create --gpus all --name mm3gen \
            -e MM3_SOLVER=ab2 -e MM3_AR_CFG_FRAMES=50 -e MM3_NO_ACT_CAST=1 \
            -e MM3_DEPTH_B1=1 -e GGML_CUDA_MMVQ_MAX=4 \
            -v minimax-weights:/models:ro \
            minimax-spike:local python3 /work/gen.py
          docker cp deploy/gpu-pc/minimax/gen.py mm3gen:/work/gen.py
          docker cp deploy/gpu-pc/minimax/prompts mm3gen:/work/prompts
          docker start -a mm3gen
          docker cp mm3gen:/out/. spike-out/
          docker rm mm3gen
          cat spike-out/gen_log.jsonl

      - name: ACE-Step up (всегда, даже при падении генерации)
        if: always()
        run: |
          docker start ace-step
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' ace-step 2>/dev/null || echo missing)
            echo "health: $st"; [ "$st" = healthy ] && break; sleep 10
          done
          [ "$st" = healthy ] || { echo "::error::ace-step не поднялся"; docker logs --tail 50 ace-step; exit 1; }

      - name: Generate ACE-Step turbo (те же 10 промптов)
        run: python3 deploy/gpu-pc/minimax/ace_gen.py spike-out
        env:
          ACE15_ENDPOINT: http://ace-step:8001

      - name: Score (CE/PQ audiobox в ace-step + ffmpeg-брак)
        run: |
          set -e
          command -v ffmpeg >/dev/null || { apt-get update -qq && apt-get install -y -qq ffmpeg; }
          python3 deploy/gpu-pc/minimax/score.py spike-out

      - name: mp3 копии MiniMax (wav → mp3 для прослушивания)
        run: |
          mkdir -p spike-out/tracks
          for f in spike-out/mm3_*.wav; do
            [ -f "$f" ] && ffmpeg -y -loglevel error -i "$f" -codec:a libmp3lame -q:a 2 "spike-out/tracks/$(basename "${f%.wav}").mp3"
          done
          cp spike-out/ace/*.mp3 spike-out/tracks/ 2>/dev/null || true
          ls -la spike-out/tracks

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: minimax-spike-results
          path: |
            spike-out/minimax_vs_ace_results.md
            spike-out/minimax_vs_ace_results.csv
            spike-out/gen_log.jsonl
            spike-out/ace_gen_log.jsonl
          if-no-files-found: error

      - name: Upload tracks (mp3)
        uses: actions/upload-artifact@v4
        with:
          name: minimax-spike-tracks
          path: spike-out/tracks/
          if-no-files-found: warn
