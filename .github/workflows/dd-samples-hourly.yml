name: dd-samples-hourly-tilt-done
on:
  schedule:
    - cron: "23 * * * *"  # каждый час :23 UTC, ~1 мин раннера на попытку
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: [self-hosted, pc]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python gradio_client
      - name: generate dd scene samples (fail fast, resume from git)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: .venv/bin/python pipeline/dd_samples.py
      - name: commit progress to repo (resume state = git files)
        if: always()
        run: |
          git config user.name "aicontent-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add samples_candidates/dd_*.mp3 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: dd samples progress [skip ci]"
          git push || true
      - name: done? disable hourly schedule
        if: success()
        run: |
          count=$(ls samples_candidates/dd_*.mp3 2>/dev/null | wc -l)
          echo "saved: $count/6"
          if [ "$count" -ge 6 ]; then
            echo "ALL DONE — disabling hourly schedule"
            gh api -X PUT repos/${{ github.repository }}/actions/workflows/dd-samples-hourly.yml/disabled \
              -H "Accept: application/vnd.github+json" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
