name: daily lo-fi video

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC daily
  # GitHub schedule опаздывает на 6-9 ч (04-13.10: старт 14:39-18:41 вместо 09:00).
  # Точное время даёт cron Hermes: dispatch с scheduled=true в 09:00 UTC (guard включён).
  workflow_dispatch:
    inputs:
      scheduled:
        description: "плановый запуск: guard (пропуск, если long-form за сегодня уже есть)"
        type: boolean
        default: false

# push ротации .state: default token = read -> было 403, ротация не сохранялась
permissions:
  contents: write

jobs:
  build:
    # one video per genre per day, each into its own playlist (05_publish.py).
    # Only owner-approved genres here (A/B rule); add after sample approval.
    strategy:
      max-parallel: 1  # single GPU
      fail-fast: false
      matrix:
        genre: ["anime lofi"]
    runs-on: [self-hosted, pc]
    timeout-minutes: 75
    env:
      ROUTER_BASE_URL: https://9router.pxbt.app/v1
      ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # DECISIONS.md п.5: конкурентный анализ показал — никто не публикует
      # 45-секундные видео, формат 10-20 мин "сигнатурный" ролик. Решение
      # было записано, но не применено в workflow — баг, видео от 2 окт
      # ушло в паблик 45-секундным. Фикс: 15 минут (900с), дробится
      # chunk_plan() в 03_music.py на куски <=240с под лимит ACE-Step.
      TRACK_DURATION_SEC: "3600"  # >600 -> час-микс из цельных треков 1.5 + треклист-главы (ресёрч 13.10: хиты ниши 1-4 ч)
      GENRE: ${{ matrix.genre }}
      ACE15_ENDPOINT: http://ace-step:8001  # ACE-Step 1.5 REST на ПК (comfynet)
      # Эталон стиля, одобрен владельцем 13.10 (сэмпл ref1): 90с K/DA Seraphine.
      # Кэш на раннере; нет файла -> 03_music генерирует без эталона.
      ACE15_REF_AUDIO: /tmp/acf-ref/ref1.wav
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true  # self-hosted: wipe previous runs/ so disk doesn't grow

      # schedule опаздывает до 18:41 UTC -> второй long-form за сутки (12.10). Ручной dispatch = намеренный.
      - name: guard (один long-form в сутки)
        id: guard
        if: github.event_name == 'schedule' || inputs.scheduled
        working-directory: pipeline
        run: python3 watchdog.py --guard

      - uses: astral-sh/setup-uv@v3
        if: steps.guard.outputs.published != '1'

      - name: install deps
        if: steps.guard.outputs.published != '1'
        run: |
          # apt на self-hosted раннере падал exit 100 (lock/битый dpkg) — ffmpeg уже стоит -> пропуск
          command -v ffmpeg || { sudo dpkg --configure -a || true; for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break; sleep 20; done; }
          command -v ffmpeg
          uv venv .venv
          uv pip install --python .venv/bin/python pillow gradio_client

      - name: 01 idea
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: ../.venv/bin/python 01_idea.py

      - name: 02 cover
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: ../.venv/bin/python 02_cover.py

      - name: 03b animate cover (Wan2.2 ZeroGPU, сбой -> статика)
        if: steps.guard.outputs.published != '1'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: pipeline
        run: ../.venv/bin/python 03b_animate.py

      # 13.10: ace-step остановлен (exit 137, stop вручную/чужим процессом) -> unless-stopped не поднимает; выпуск падал бы на 03 music
      - name: ACE-Step up (start if stopped, wait health)
        if: steps.guard.outputs.published != '1'
        run: |
          docker start ace-step >/dev/null 2>&1 || true
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ace-step 2>/dev/null)" = healthy ] && { echo "ace-step healthy"; exit 0; }
            sleep 6
          done
          echo "::error::ace-step не healthy за 4 мин"; exit 1

      - name: reference audio (cache)
        if: steps.guard.outputs.published != '1'
        continue-on-error: true
        run: |
          [ -s "$ACE15_REF_AUDIO" ] && exit 0
          mkdir -p /tmp/acf-ref && python3 -m venv /tmp/acf-ref/v && /tmp/acf-ref/v/bin/pip install -q -U yt-dlp
          /tmp/acf-ref/v/bin/yt-dlp -q -f bestaudio -o '/tmp/acf-ref/raw1.%(ext)s' https://youtu.be/CYZeAfaj3pc
          ffmpeg -loglevel error -y -ss 30 -t 90 -i /tmp/acf-ref/raw1.* -ac 2 -ar 48000 "$ACE15_REF_AUDIO"

      - name: 03 music (ACE-Step)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: ../.venv/bin/python 03_music.py

      - name: 04 assemble (ffmpeg)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: ../.venv/bin/python 04_assemble.py

      - name: 05 publish (skips if no YouTube token secret)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            mkdir -p ../.state
            printf '%s' "$YOUTUBE_TOKEN_JSON" > ../.state/youtube_token.json
            uv pip install --quiet --python ../.venv/bin/python google-api-python-client google-auth-oauthlib
            ../.venv/bin/python 05_publish.py
          else
            echo "skip: секрет YOUTUBE_TOKEN_JSON не задан, публикация отложена"
          fi

      - name: 07 shorts (2 x 9:16 из long-form, ссылка на него)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: |
          if [ -f ../.state/youtube_token.json ]; then
            uv pip install --quiet --python ../.venv/bin/python librosa
            ../.venv/bin/python 07_shorts.py
          else
            echo "skip: нет YouTube токена"
          fi

      - name: TG report (ролик + шортсы)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: python3 watchdog.py --report || true

      - name: commit mood rotation state
        if: steps.guard.outputs.published != '1'
        run: |
          git config user.name "aicontent-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .state/*_idx.txt 2>/dev/null || true  # mood + scene + fallback ротации
          git diff --cached --quiet || git commit -m "chore: advance mood rotation [skip ci]"
          git pull --rebase -q || true
          git push

      - name: TG alert on failure (без секретов TG_* — только лог)
        if: failure()
        working-directory: pipeline
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: |
          python3 -c "from common import tg_send; tg_send('❌ daily-video (${{ matrix.genre }}) упал. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Если причина invalid_grant — перевыпусти токен: python3 pipeline/youtube_oauth.py --auth-url')"

      - name: upload run artifact
        if: steps.guard.outputs.published != '1'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            runs/*/video.mp4
            runs/*/short_*.mp4
          retention-days: 14
