name: daily lo-fi video

on:
  schedule:
    # 2 жанра/день (t_c678b8fa шаг 3): lofi 09:00 UTC + ретраи 13/17,
    # phonk 11:00 + ретрай 15. Слоты жанра не пересекаются; guard теперь
    # genre-aware (watchdog.already_published) — лишний слот = no-op.
    - cron: "0 9,13,17 * * *"
    - cron: "0 11,15 * * *"
  # GitHub schedule опаздывает на 6-9 ч (04-13.10: старт 14:39-18:41 вместо 09:00).
  # Точное время даёт cron Hermes: dispatch с scheduled=true в 09:00 UTC (guard включён).
  workflow_dispatch:
    inputs:
      scheduled:
        description: "плановый запуск: guard (пропуск, если long-form жанра за сегодня уже есть)"
        type: boolean
        default: false
      # g1zm0-gate.yml: перегенерация после Content ID claim (один жанр, другой эталон/промпт)
      genre:
        description: "только этот жанр матрицы (пусто = все)"
        type: string
        default: ""
      g1zm0_day:
        description: "день ротации YYYY-MM-DD (пусто = сегодня UTC)"
        type: string
        default: ""
      g1zm0_attempt:
        description: "попытка ротации (claim -> +1)"
        type: string
        default: "0"

# слоты не перекрываются: второй run ждёт первый и guard видит выпуск
concurrency:
  group: daily-video
  cancel-in-progress: false

# push ротации .state: default token = read -> было 403, ротация не сохранялась
permissions:
  contents: write
  actions: read

jobs:
  build:
    # one video per genre per day, each into its own playlist (05_publish.py).
    # 2 жанра = 2 выпуска/день (t_c678b8fa): "anime lofi" (одобрен 13.10) и
    # "chill phonk" (направление одобрено 14.10, v2 выбран оркестратором 16.10).
    # Жанр живёт на своих cron-слотах (см. guard-step); ручной dispatch гоняет оба.
    strategy:
      max-parallel: 1  # single GPU
      fail-fast: false
      matrix:
        include:
          # lofi (t_d53850f6): ротация CC BY эталонов/промптов по дню + Content ID гейт (unlisted, public после одобрения)
          - genre: "anime lofi"
            slots: "0 9,13,17 * * *"
            gate: "1"
          - genre: "chill phonk"
            slots: "0 11,15 * * *"
            gate: "0"  # phonk v1-v3 одобрены БЕЗ эталона (noref) — эталон не подмешивать
    # pc-acf-release: setup-uv падает EACCES (spawn uv, 16.10) — выпуск на проверенном pc-acf
    runs-on: [self-hosted, pc]
    # 16.10 run 38886770624: music 40 мин + аплоад часа >34 мин -> 75 обрезал 05 publish
    timeout-minutes: 150
    env:
      ROUTER_BASE_URL: https://9router.pxbt.app/v1
      ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # DECISIONS.md п.5: конкурентный анализ показал — никто не публикует
      # 45-секундные видео, формат 10-20 мин "сигнатурный" ролик. Решение
      # было записано, но не применено в workflow — баг, видео от 2 окт
      # ушло в паблик 45-секундным. Фикс: 15 минут (900с), дробится
      # chunk_plan() в 03_music.py на куски <=240с под лимит ACE-Step.
      TRACK_DURATION_SEC: "3600"  # >600 -> час-микс из цельных треков 1.5 + треклист-главы (ресёрч 13.10: хиты ниши 1-4 ч)
      GENRE: ${{ matrix.genre }}
      ACE15_ENDPOINT: http://ace-step:8001  # ACE-Step 1.5 REST на ПК (comfynet)
      # Чужой OST (K/DA Seraphine) убран 16.10: юр. риск + Content ID. Эталон = пул 10x90с CC BY
      # (refs/LICENSES.md), кэш на раннере; нет файла -> 03_music генерирует без эталона.
      G1ZM0_GATE: ${{ matrix.gate }}
      G1ZM0_REF_DIR: /tmp/acf-refs
      G1ZM0_DAY: ${{ inputs.g1zm0_day }}
      G1ZM0_ATTEMPT: ${{ inputs.g1zm0_attempt || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true  # self-hosted: wipe previous runs/ so disk doesn't grow

      # schedule опаздывает до 18:41 UTC -> второй long-form за сутки (12.10). Ручной dispatch = намеренный.
      # Слот жанра: cron-ы обеих матриц срабатывают оба, чужой слот = published=1 (скип всех шагов).
      - name: guard (один long-form жанра в сутки)
        id: guard
        if: github.event_name == 'schedule' || inputs.scheduled || inputs.genre != ''
        working-directory: pipeline
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "${{ matrix.slots }}" ]; then
            echo "не слот жанра $GENRE (его слоты: ${{ matrix.slots }}), скип"
            echo "published=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${{ inputs.genre }}" ]; then
            # перегенерация гейта: только свой жанр, guard дня не нужен (прошлая попытка = claim)
            [ "${{ inputs.genre }}" = "$GENRE" ] || { echo "dispatch для ${{ inputs.genre }}, скип $GENRE"; echo "published=1" >> "$GITHUB_OUTPUT"; }
            exit 0
          fi
          python3 watchdog.py --guard

      - uses: astral-sh/setup-uv@v3
        if: steps.guard.outputs.published != '1'

      - name: install deps
        if: steps.guard.outputs.published != '1'
        run: |
          # apt на self-hosted раннере падал exit 100 (lock/битый dpkg) — ffmpeg уже стоит -> пропуск
          command -v ffmpeg || { sudo dpkg --configure -a || true; for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break; sleep 20; done; }
          command -v ffmpeg
          uv venv .venv
          uv pip install --python .venv/bin/python pillow gradio_client

      - name: 01 idea
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: ../.venv/bin/python 01_idea.py

      - name: 02 cover
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: ../.venv/bin/python 02_cover.py

      - name: 03b animate cover (Wan2.2 ZeroGPU, сбой -> статика)
        if: steps.guard.outputs.published != '1'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: pipeline
        run: ../.venv/bin/python 03b_animate.py

      # 13.10: ace-step остановлен (exit 137, stop вручную/чужим процессом) -> unless-stopped не поднимает; выпуск падал бы на 03 music
      - name: ACE-Step up (start if stopped, wait health)
        if: steps.guard.outputs.published != '1'
        run: |
          docker start ace-step >/dev/null 2>&1 || true
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ace-step 2>/dev/null)" = healthy ] && { echo "ace-step healthy"; exit 0; }
            sleep 6
          done
          echo "::error::ace-step не healthy за 4 мин"; exit 1

      - name: reference pool (CC BY, cache)
        if: steps.guard.outputs.published != '1' && env.G1ZM0_GATE == '1'
        continue-on-error: true  # нет эталона -> генерация без него, выпуск не падает
        timeout-minutes: 20
        run: python3 pipeline/fetch_refs.py

      - name: 03 music (ACE-Step)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: ../.venv/bin/python 03_music.py

      - name: 04 assemble (ffmpeg)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        run: ../.venv/bin/python 04_assemble.py

      - name: 05 publish (skips if no YouTube token secret)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            mkdir -p ../.state
            printf '%s' "$YOUTUBE_TOKEN_JSON" > ../.state/youtube_token.json
            uv pip install --quiet --python ../.venv/bin/python google-api-python-client google-auth-oauthlib
            ../.venv/bin/python 05_publish.py
          else
            echo "skip: секрет YOUTUBE_TOKEN_JSON не задан, публикация отложена"
          fi

      - name: 07 shorts (2 x 9:16 из long-form, ссылка на него)
        # гейт: long-form unlisted до одобрения -> публичные шортсы на него не льём
        if: steps.guard.outputs.published != '1' && env.G1ZM0_GATE != '1'
        working-directory: pipeline
        run: |
          if [ -f ../.state/youtube_token.json ]; then
            uv pip install --quiet --python ../.venv/bin/python librosa
            ../.venv/bin/python 07_shorts.py
          else
            echo "skip: нет YouTube токена"
          fi

      - name: TG report (ролик + шортсы)
        if: steps.guard.outputs.published != '1'
        working-directory: pipeline
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: python3 watchdog.py --report || true

      - name: commit mood rotation state
        if: steps.guard.outputs.published != '1'
        run: |
          git config user.name "aicontent-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .state/*_idx.txt 2>/dev/null || true  # mood + scene + fallback ротации
          git add -f .state/g1zm0_gate 2>/dev/null || true  # записи Content ID гейта (g1zm0-gate.yml)
          git diff --cached --quiet || git commit -m "chore: advance mood rotation [skip ci]"
          git pull --rebase -q || true
          git push

      - name: TG alert on failure (без секретов TG_* — только лог)
        if: failure()
        working-directory: pipeline
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # называем упавший шаг фактом из API, а не догадкой о причине
          python3 - <<'PY'
          import json, os, urllib.request
          from common import tg_send
          api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs"
          try:
              jobs = json.load(urllib.request.urlopen(urllib.request.Request(api, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]}), timeout=30))["jobs"]
              failed = ", ".join(s["name"] for j in jobs for s in j.get("steps", []) if s.get("conclusion") == "failure") or "не определён"
          except Exception as e:
              failed = f"не определён ({e.__class__.__name__})"
          tg_send(f"❌ daily-video (${{ matrix.genre }}) упал на шаге: {failed}. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          PY

      - name: upload run artifact
        if: steps.guard.outputs.published != '1'
        # ponytail: artifact is debug-only (video is on YouTube); storage quota must never fail the release
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            runs/*/video.mp4
            runs/*/short_*.mp4
          retention-days: 3
