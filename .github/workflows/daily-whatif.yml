name: whatif code-2D (S1 ch2)
# S1 ch2 «What if...»: 3 Shorts/день (9:16, 20-30 с, хук) + long (>=4 мин, 1080p) раз в WHATIF_LONG_EVERY дней, 2D-анимацию рисует код (pipeline/whatif_channel.py).
# Флаг: vars.CODE2D == '1' включает режим; снять флаг = откат (все шаги no-op).
# Публикация: ch1 отдельным плейлистом «What If...» (второго Google-аккаунта нет); квота: 4 videos.insert из 100/сутки.
on:
  schedule:
    - cron: "0 18 * * *"  # 1 выпуск/день, US полдень
  workflow_dispatch: {}

concurrency:
  group: daily-whatif
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, release]
    timeout-minutes: 60
    env:
      ROUTER_BASE_URL: https://9router.pxbt.app/v1
      ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
      CODE2D: ${{ vars.CODE2D }}
      # t_47c41540: хук 0-1 с, Shorts 20-30 с, long 1 раз в N дней. Пусто = дефолты кода (1 / 30 / 2).
      # Откат одним изменением: repo var WHATIF_LEGACY=1 (без хука, Shorts <=58 с, long каждый день).
      WHATIF_HOOK: ${{ vars.WHATIF_HOOK }}
      WHATIF_SHORT_MAX: ${{ vars.WHATIF_SHORT_MAX }}
      WHATIF_LONG_EVERY: ${{ vars.WHATIF_LONG_EVERY }}
      WHATIF_LEGACY: ${{ vars.WHATIF_LEGACY }}
    steps:
      - name: flag
        id: flag
        run: |
          if [ "$CODE2D" = "1" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "code-2D disabled (vars.CODE2D != 1)"; fi
      - uses: actions/checkout@v4
        if: steps.flag.outputs.go == '1'
      - uses: astral-sh/setup-uv@v3
        if: steps.flag.outputs.go == '1'
      - name: install deps
        if: steps.flag.outputs.go == '1'
        run: |
          command -v ffmpeg || { sudo apt-get update -y && sudo apt-get install -y ffmpeg; }
          uv venv .venv
          uv pip install --python .venv/bin/python pillow edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: self-check
        if: steps.flag.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python test_whatif.py
      - name: idea (script + scene DSL)
        if: steps.flag.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python whatif_channel.py idea
      - name: render (tts + code-2D)
        if: steps.flag.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python whatif_channel.py render
      # P19: гейт до заливки (целостность, чёрный кадр, формат шортса, обложка). FAIL = не публиковать.
      - name: quality gate video (FAIL = не публиковать)
        if: steps.flag.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python quality_gate.py --video
      # t_f807dc99: без GO гейта запуска ch2 — выход без upload (рендер/QA остаются, токен не пишется).
      - name: launch gate (NO-GO = без upload)
        id: gate
        if: steps.flag.outputs.go == '1'
        run: |
          if python3 scripts/launch_gate.py ch2-whatif; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::launch gate NO-GO: upload ch2 пропущен (reports/products/ch2-whatif.launch.md)"; fi
      - name: token
        if: steps.gate.outputs.go == '1'
        env:
          YT_CH1_TOKEN_JSON: ${{ secrets.YT_CH1_TOKEN_JSON }}
        run: |
          mkdir -p .state
          printf '%s' "$YT_CH1_TOKEN_JSON" > .state/youtube_token.json
      - name: publish (3 Shorts + long по графику, в плейлист)
        if: steps.gate.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python whatif_channel.py publish
      - name: commit rotation state
        if: steps.flag.outputs.go == '1'
        run: |
          git config user.name "aicontent-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .state/whatif_idx.txt
          git diff --cached --quiet || git commit -m "chore: advance whatif rotation [skip ci]"
          git pull --rebase -q && git push || true  # root-cause: t_f95a06da
      - name: upload artifact
        if: steps.flag.outputs.go == '1' && always()
        continue-on-error: true  # root-cause: t_f95a06da
        uses: actions/upload-artifact@v4  # artifact-ok: логи прогона; доставка результата вне артефактов
        with:
          name: whatif-${{ github.run_id }}
          path: |
            runs/*/idea.json
            runs/*/render.json
            runs/*/published.json
            runs/*/short_*.mp4
          retention-days: 1  # t_9d452170: доставка вне артефактов (TG/git); квота storage 500MB
      - name: cleanup token
        if: always()
        run: rm -f .state/youtube_token.json
