name: xl-probe
# t_d92f4c8f: XL-sft убит (t_b4006a6e KILL: 1417 с на кандидат) -> файл переиспользован под turbo LoRA.
# LoRA на acestep-v15-turbo (одобренные: 3 трека A/B t_6aa41295 + CC BY эталоны refs/LICENSES.md)
# -> слепой A/B 4 x 90 с: 2 x прод (turbo, best-of-3, без LoRA) vs 2 x turbo+LoRA best-of-3, все через quality_gate.
# LoRA: /app/output/lora/turbo/final (XL-веса /app/output/lora/out не трогаем).
# Доставка: base64 в лог (exfil) -> VPS -> TG-топик. Маппинг только в строке BLINDMAP.
on:
  workflow_dispatch:
    inputs:
      reuse_lora:
        description: "не обучать заново, взять /app/output/lora/turbo/final"
        type: boolean
        default: false
concurrency:
  group: daily-video
  cancel-in-progress: false
jobs:
  run:
    runs-on: [self-hosted, pc]
    timeout-minutes: 200
    env:
      ACE15_ENDPOINT: http://ace-step:8001
      GENRE: anime lofi
      TRACK_DURATION_SEC: "90"
      ACE15_BESTOF: "3"
      ACE15_REF_AUDIO: /tmp/acf-ref/ref1.wav  # как прод anime lofi
      L: /app/output/lora/turbo
    steps:
      - uses: actions/checkout@v4

      - name: GPU window guard (08-12 UTC = выпуски)
        run: |
          h=$(date -u +%H); [ "$h" -lt 8 ] || [ "$h" -ge 12 ] || { echo "::error::08-12 UTC GPU за выпусками, сейчас ${h}h"; exit 1; }

      - name: install deps + ref audio
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          python3 -m venv /tmp/xlv
          for i in 1 2 3 4; do /tmp/xlv/bin/pip -q --retries 5 --timeout 60 install gradio_client numpy && break; sleep 20; done
          /tmp/xlv/bin/python -c "import gradio_client, numpy"
          rm -rf /tmp/xlrun runs && mkdir -p /tmp/xlrun
          # gen <имя> [env...]: прод-путь 03_music.main() (best-of-3 через quality_gate). Падение варианта не валит остальные.
          cat > /tmp/xlrun/gen.sh <<'SH'
          gen() {
            local name=$1; shift
            d=runs/$(date -u +%Y%m%d_%H%M%S)_$name; mkdir -p "$d"
            echo '{"mood": "cozy lofi"}' > "$d/idea.json"
            if env "$@" PYTHONUNBUFFERED=1 timeout -k 30 1500 /tmp/xlv/bin/python -u pipeline/03_music.py 2>&1 | tee "/tmp/xlrun/$name.log"; then
              cp "$d/track.mp3" "/tmp/xlrun/$name.mp3"; cp "$d/music_meta.json" "/tmp/xlrun/$name.json"
            else
              echo "VARIANT-FAIL $name" >&2
            fi
            sleep 1
          }
          SH
          [ -s "$ACE15_REF_AUDIO" ] && exit 0
          mkdir -p /tmp/acf-ref && python3 -m venv /tmp/acf-ref/v && /tmp/acf-ref/v/bin/pip install -q -U yt-dlp
          /tmp/acf-ref/v/bin/yt-dlp -q -f bestaudio -o '/tmp/acf-ref/raw1.%(ext)s' https://youtu.be/CYZeAfaj3pc
          ffmpeg -loglevel error -y -ss 30 -t 90 -i /tmp/acf-ref/raw1.* -ac 2 -ar 48000 "$ACE15_REF_AUDIO"

      - name: ace-step clean (turbo, no LoRA)
        run: |
          docker restart ace-step >/dev/null
          for i in $(seq 1 72); do [ "$(docker inspect -f '{{.State.Health.Status}}' ace-step)" = healthy ] && break; sleep 10; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' ace-step)" = healthy ]

      - name: prod arm (turbo, best-of-3, no LoRA)
        timeout-minutes: 60
        run: |
          set -o pipefail; . /tmp/xlrun/gen.sh
          gen prod_1; gen prod_2

      # Side-Step в образе: двухфазный train.py fixed (preprocess -> выход; затем обучение на тензорах).
      # adamw8bit без bitsandbytes в образе падает на AdamW (лог 38995574290) — видно в логе.
      - name: train turbo LoRA (approved only)
        if: ${{ !inputs.reuse_lora }}
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          docker exec ace-step sh -c "rm -rf $L && mkdir -p $L/audio"
          # 3 одобренных A/B v4 (t_6aa41295) — ассеты пре-релиза lora-ds-t_d92f4c8f, sha256 зафиксированы в репо
          rm -rf /tmp/tlds && mkdir -p /tmp/tlds
          python3 - <<'PY'
          import json, os, urllib.request
          h = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}"}
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          rel = json.load(urllib.request.urlopen(urllib.request.Request(f"{api}/releases/tags/lora-ds-t_d92f4c8f", headers=h)))
          for a in rel["assets"]:
              r = urllib.request.Request(a["url"], headers={**h, "Accept": "application/octet-stream"})
              open(f"/tmp/tlds/{a['name']}", "wb").write(urllib.request.urlopen(r).read())
          PY
          (cd /tmp/tlds && sha256sum -c --strict "$GITHUB_WORKSPACE/pipeline/lora_ds.sha256")
          for f in /tmp/tlds/*.mp3; do docker cp "$f" ace-step:$L/audio/ && echo "approved: $(basename $f)"; done
          # CC BY эталоны (refs/LICENSES.md) на томе ПК с прогона 38995574290
          docker exec ace-step sh -c "cp /app/output/lora/audio/macleod_*.wav $L/audio/"
          N=$(docker exec ace-step sh -c "ls $L/audio | wc -l"); echo "dataset: $N files"
          [ "$N" -ge 13 ] || { echo "::error::датасет $N < 13 (3 A/B + 10 эталонов)"; exit 1; }
          PY=/app/.venv/bin/python
          docker exec ace-step sh -c "$PY -c 'import loguru'" 2>/dev/null || {
            python3 -m pip install -q --target /tmp/pylibs loguru
            docker exec ace-step mkdir -p /tmp/pylibs; docker cp /tmp/pylibs/. ace-step:/tmp/pylibs/; }
          A="--checkpoint-dir /app/checkpoints --model-variant acestep-v15-turbo --base-model turbo \
            --tensor-output $L/tensors --output-dir $L --rank 32 --optimizer-type adamw8bit --offload-encoder \
            --batch-size 1 --gradient-accumulation 4 --epochs 20"
          docker exec -e PYTHONPATH=/tmp/pylibs ace-step $PY train.py fixed $A --preprocess --audio-dir $L/audio --dataset-dir $L/dataset
          printf 'y\n' | docker exec -i -e PYTHONPATH=/tmp/pylibs ace-step $PY train.py fixed $A --dataset-dir $L/tensors
          docker exec ace-step ls -la $L/final

      - name: lora arm (turbo + LoRA, best-of-3)
        timeout-minutes: 70
        run: |
          set -o pipefail; . /tmp/xlrun/gen.sh
          docker restart ace-step >/dev/null  # VRAM после обучения
          for i in $(seq 1 72); do [ "$(docker inspect -f '{{.State.Health.Status}}' ace-step)" = healthy ] && break; sleep 10; done
          gen lora_1 ACE15_LORA=$L/final; gen lora_2 ACE15_LORA=$L/final

      - name: blind map
        run: |
          N=$(find /tmp/xlrun -maxdepth 1 -name '*.mp3' ! -name 'versija_*' | wc -l); echo "вариантов: $N"
          [ "$N" -ge 2 ] || { echo "::error::A/B не собран"; cat /tmp/xlrun/*.log; exit 1; }
          python3 - <<'PY'
          import json, random, shutil
          from pathlib import Path
          out = Path("/tmp/xlrun")
          ok = sorted(p.stem for p in out.glob("*.mp3") if not p.name.startswith("versija"))
          random.shuffle(ok)
          rep = {}
          for i, n in enumerate(ok):
              v = f"versija_{i + 1}"
              shutil.copy(out / f"{n}.mp3", out / f"{v}.mp3")
              b = json.loads((out / f"{n}.json").read_text()).get("bestof") or {}
              c = b.get("cands", [])
              rep[v] = {"ce_picked": round(min(c[b["picked"]]["ce"]), 2) if c else None,
                        "cands": [{"ce_min": round(min(x["ce"]), 2), "fail": x["fail"]} for x in c]}
          (out / "ce_report.json").write_text(json.dumps(rep, ensure_ascii=False, indent=1))
          print("BLINDMAP " + json.dumps({f"versija_{i + 1}": n for i, n in enumerate(ok)}))
          print(json.dumps(rep, ensure_ascii=False, indent=1))
          PY

      # ace-step обязан вернуться в прод (turbo, без LoRA), иначе daily-video уйдёт с LoRA.
      - name: restore prod ace-step (turbo, no LoRA)
        if: ${{ always() }}
        timeout-minutes: 15
        run: |
          curl -sf -m 120 -X POST http://ace-step:8001/v1/lora/unload -H 'Content-Type: application/json' -d '{}' || true
          docker restart ace-step >/dev/null
          for i in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' ace-step)" = healthy ] && break; sleep 10; done
          curl -sf -m 60 http://ace-step:8001/v1/lora/status | head -c 400; echo

      # Контейнеры ПК без исходящего 443, artifact quota исчерпана -> base64 в лог; VPS собирает и шлёт владельцу.
      - name: exfil to log (base64)
        if: ${{ always() }}
        run: |
          cd /tmp/xlrun 2>/dev/null || exit 0
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          files = sorted(Path(".").glob("versija_*.mp3")) + [Path("ce_report.json")] + sorted(Path(".").glob("*.log"))
          files = [f for f in files if f.is_file()]
          print("XFMETA " + json.dumps({str(f): hashlib.sha256(f.read_bytes()).hexdigest() for f in files}))
          for f in files:
              b = base64.b64encode(f.read_bytes()).decode()
              for j in range(0, len(b), 60000):
                  print(f"XF64 {f} {j // 60000:04d} {b[j:j + 60000]}")
          PY
