name: bank reserve
# t_1f53095a R3: часовой отчёт запаса банка. Цель >= 2 выпуска (40 сегм.). < 1 выпуска (20):
# TG-строка + bank-fill вне расписания (генератор в приоритет). Пусто = слот пропускает bank_release (exit 2).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write  # dispatch bank-fill
jobs:
  reserve:
    runs-on: [self-hosted, release]  # pc-раннер часами занят bank-fill — отчёт не ждёт его
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: venv  # bank.py импортирует numpy — системный python его не имеет (test_workflow_python)
        run: |
          uv venv .venv
          for i in 1 2 3; do UV_HTTP_TIMEOUT=120 uv pip install --python .venv/bin/python numpy gradio_client && break; [ $i = 3 ] && exit 1; sleep 30; done
      - name: reserve check
        working-directory: pipeline
        run: ../.venv/bin/python bank.py --reserve
