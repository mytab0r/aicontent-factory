name: oneoff-dd-samples
on:
  workflow_dispatch: {}

# новый пуш в ветку эксперимента заменяет старый прогон, а не встаёт в очередь
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: [self-hosted, pc]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python gradio_client
      - name: generate dd scene samples (fail fast, resume on re-dispatch)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: .venv/bin/python pipeline/dd_samples.py
      - name: upload artifact (даже при неполном результате)
        if: always()
        uses: actions/upload-artifact@v4  # artifact-ok: логи прогона; доставка результата вне артефактов
        with:
          name: dd-samples-${{ github.run_id }}
          path: samples_candidates/dd_*.mp3
          if-no-files-found: error
          retention-days: 1  # t_9d452170: доставка вне артефактов (TG/git); квота storage 500MB
      - name: report
        if: always()
        run: |
          count=$(ls samples_candidates/dd_*.mp3 2>/dev/null | wc -l)
          echo "saved: $count/6 dd samples"
