name: ace-step restore (t_03efb867)
on:
  push:
    branches: ["ops/ace-step-restore"]
permissions:
  contents: read
concurrency:
  group: ace-step-restore
jobs:
  restore:
    runs-on: [self-hosted, pc]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: relay bloblist regression (t_d80ff074)
        run: python3 deploy/gpu-pc/test_ace_relay.py
      - name: HF ranged download regression (t_5dccab9e)
        run: python3 pipeline/test_hf_get.py
      - name: ensure ace-step bounded-failure regression (t_14d314c2)
        run: python3 deploy/gpu-pc/test_ensure_ace_step.py
      - name: relay blob download proof (t_5dccab9e)
        # real HF download of the blob that failed in runs 39289005487/39290291128; on demand via commit tag
        if: contains(github.event.head_commit.message, '[relay-proof]')
        timeout-minutes: 60
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          hex=05ef786fe0dd8c118faee7c6964d759a1ae47576a86cfe8d0a76379b9ef9a2b3
          D=/work/dockerlocal/ace-relay/proof
          trap 'docker exec hermes-runner rm -rf $D' EXIT
          printf '%s' "$HF_TOKEN" | docker exec -i hermes-runner sh -c "mkdir -p $D && umask 077 && cat > $D/.tok"
          docker cp deploy/gpu-pc/hf_get.sh hermes-runner:$D/hf_get.sh
          free=$(docker exec hermes-runner df -BG --output=avail /work | tail -1 | tr -dc 0-9)
          echo "D: free ${free}G"; [ "$free" -ge 50 ] || { echo "::error::D: free ${free}G < 50G floor+blob"; exit 1; }
          docker exec hermes-runner sh -c "cd $D && sh hf_get.sh https://huggingface.co/datasets/mytab0r/ace-step-relay/resolve/main/$hex.blob $hex.blob -H \"Authorization: Bearer \$(cat .tok)\" && ls -l $hex.blob && sha256sum $hex.blob | grep -q $hex && echo PROOF_OK $hex"
      - name: ensure ace-step
        timeout-minutes: 280
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          printf '%s' "$HF_TOKEN" > /tmp/.relay-token
          chmod 600 /tmp/.relay-token
          # D: via docker.sock cp into hermes-runner (D:\ = /work there)
          docker cp /tmp/.relay-token hermes-runner:/work/hermes-codex/.relay-token
          docker exec hermes-runner chmod 600 /work/hermes-codex/.relay-token
          trap 'rm -f /tmp/.relay-token; docker exec hermes-runner rm -f /work/hermes-codex/.relay-token || true' EXIT
          sh deploy/gpu-pc/ensure_ace_step.sh
      - name: verify from runner (comfynet)
        run: |
          getent hosts ace-step
          curl -fsS --max-time 10 http://ace-step:8001/health; echo
      - name: audit (R5, read-only)
        if: always()
        run: |
          for c in gh-runner-acf-release gh-runner-aicontent-factory hermes-runner; do
            echo "== $c writable $(docker ps -s --filter name=^/$c$ --format '{{.Size}}')"
            docker exec $c sh -c 'du -xh -d2 / 2>/dev/null | sort -rh | head -15' || true
          done
          echo "== hermes-runner:0.22.2-hf users"; docker ps -a --filter ancestor=hermes-runner:0.22.2-hf --format '{{.Names}}' ; docker image inspect hermes-runner:0.22.2-hf -f 'created={{.Created}} labels={{json .Config.Labels}}' || true
          docker system df
