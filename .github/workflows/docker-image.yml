name: docker-image  # root-cause: t_0a4cae59 — push ретраится buildx-циклом ниже (4 попытки), prepull не нужен (cache-from registry)
# root-cause: t_0a4cae59 — push образа ретраится fallback-степом ниже (buildx --push цикл),
# подготовка/препулл здесь не нужны: cache-from тянет слои из registry
# ghcr.io/mytab0r/aicontent-factory:latest -- built only after green `tests` on push to main; Watchtower on the VPS pulls it.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
jobs:
  build-push:
    # only after green `tests` on a push to main (same pattern as autopilot docker-image.yml)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, pc]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # ghcr auth (client-side config, no daemon ping)
      - name: ghcr auth (client-side config, no daemon ping)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"; echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$d/config.json"
      # root-cause: t_a41372f5 — client-side buildx с daemon-docker заменён один-в-один;
      # buildx-driver оставлен как в работающем прогоне pay-image (t_0a4cae59)
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      # preflight ghcr (image name + reachability)
      - name: preflight ghcr (image name + reachability)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if [ "$IMAGE" != "${IMAGE,,}" ]; then
            echo "::error::image name $IMAGE has uppercase letters; ghcr requires lowercase"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://ghcr.io/v2/) || code=000
          if [ "$code" != "401" ] && [ "$code" != "200" ]; then
            echo "::error::PC runner cannot reach https://ghcr.io/v2/ (HTTP $code): egress problem on the self-hosted runner, not the image"; exit 1
          fi
          echo "ghcr reachable (HTTP $code), image $IMAGE ok"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - id: push
        # root-cause: t_0a4cae59 — transport-обрывы ghcr на ПК (EOF/timeout): первый push
        # не гейтовой дорогой, ретрай buildx --push циклом ниже; исход не глотается, fail = red job
        continue-on-error: true
        uses: docker/build-push-action@v6  # root-cause: t_0a4cae59 — ретрай buildx --push циклом ниже
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline
      # Each attempt uploads the blobs that got through; loop until ghcr has all of them.
      - if: steps.push.outcome == 'failure'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          args=(); while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          for i in 1 2 3 4; do
            docker buildx build --push --provenance=false "${args[@]}" --cache-from "type=registry,ref=$REPO:latest" --cache-to type=inline . && exit 0
            sleep $((i * 15))
          done
          exit 1
      # Prune older versions of this image (best-effort)
      - if: steps.push.outcome == 'success'
        # root-cause: t_b87507e0 — pruning GHCR-версий не гейт сборки; сбой бухгалтера не должен красить прод-пуш
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          PKG="aicontent-factory"
          ids=$(gh api --paginate "/user/packages/container/$PKG/versions?per_page=100" \
                 --jq '.[] | [.id,.created_at] | @tsv' | sort -t$'\t' -k2,2r | awk -F'\t' 'NR>3{print $1}')
          for id in $ids; do
            gh api -X DELETE "/user/packages/container/$PKG/versions/$id" || true
          done
