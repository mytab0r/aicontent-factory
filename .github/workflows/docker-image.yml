name: docker-image
# ghcr.io/mytab0r/aicontent-factory:latest -- built only after green `tests` on push to main; Watchtower on the VPS pulls it.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
jobs:
  build-push:
    # only after green `tests` on a push to main (same pattern as autopilot docker-image.yml)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, pc]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # ghcr auth (client-side config, no daemon ping)
      - name: ghcr auth (client-side config, no daemon ping)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"; echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$d/config.json"
      # root-cause t_a41372f5: docker-container драйвер = пустой BuildKit на каждый прогон, база node:22-alpine
      # каждый раз заново с CloudFront Docker Hub (обрывы -> httpReadSeeker unexpected EOF). docker-драйвер
      # берёт слои из store демона ПК, где ci/pay-image-smoke уже собрал этот Dockerfile.
      - uses: docker/setup-buildx-action@v3
        with:
          # docker-драйвер не поддерживает buildkitd-config-inline (max-parallelism был для docker-container)
          driver: docker
      # preflight ghcr (image name + reachability)
      - name: preflight ghcr (image name + reachability)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if [ "$IMAGE" != "${IMAGE,,}" ]; then
            echo "::error::image name $IMAGE has uppercase letters; ghcr requires lowercase"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://ghcr.io/v2/) || code=000
          if [ "$code" != "401" ] && [ "$code" != "200" ]; then
            echo "::error::PC runner cannot reach https://ghcr.io/v2/ (HTTP $code): egress problem on the self-hosted runner, not the image"; exit 1
          fi
          echo "ghcr reachable (HTTP $code), image $IMAGE ok"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      # root-cause t_0a4cae59: transport-обрывы egress ПК (WSL NAT / Docker Desktop proxy) роняли сборку на
      # живом GET слоя базы (httpReadSeeker unexpected EOF -> failed to compute cache key) и push к ghcr
      # (oauth token EOF). driver=docker (t_a41372f5) убрал пустой BuildKit, но базу, которой нет в store,
      # демон всё равно тянет одним GET без ретраев. Механика класса: 1) базу тянем отдельно с 4 попытками
      # (слои докачиваются, не дублируются), как в ci/e2e-admin; 2) build-push повторяем целиком до 4 раз
      # только на transport-ошибках registry (EOF / timeout / connection reset), не маскируя другие отказы.
      - name: pre-pull base (4 attempts, resumable layers)
        run: |
          B=$(sed -n 's/^FROM //p' Dockerfile | head -1)
          for n in 1 2 3 4; do docker pull -q "$B" && break; [ $n = 4 ] && exit 1; echo "pull $B: попытка $n не удалась, повтор через $((n*20)) с"; sleep $((n*20)); done
      - name: build + push (retry on registry transport errors only)
        run: |
          args=(); while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "${{ steps.meta.outputs.tags }}"
          for i in 1 2 3 4; do
            docker buildx build --push --provenance=false "${args[@]}" --cache-from "type=registry,ref=ghcr.io/${{ github.repository }}:latest" --cache-to type=inline . && exit 0
            sleep $((i * 15))
          done
          exit 1
      # Prune older versions of this image (best-effort)
      - if: always()
        # root-cause: t_f95a06da — prune best-effort, не валит деплой
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          PKG="aicontent-factory"
          ids=$(gh api --paginate "/user/packages/container/$PKG/versions?per_page=100" \
                 --jq '.[] | [.id,.created_at] | @tsv' | sort -t$'\t' -k2,2r | awk -F'\t' 'NR>3{print $1}')
          for id in $ids; do
            gh api -X DELETE "/user/packages/container/$PKG/versions/$id" || true
          done
