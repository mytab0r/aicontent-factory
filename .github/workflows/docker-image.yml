name: docker-image
# ghcr.io/mytab0r/aicontent-factory:latest -- built only after green `tests` on push to main; Watchtower on the VPS pulls it.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
jobs:
  build-push:
    # only after green `tests` on a push to main (same pattern as autopilot docker-image.yml)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, pc]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # ghcr auth (client-side config, no daemon ping)
      # root-cause: t_831d9fd6 -- docker/login-action runs `docker login`, i.e. one daemon-side ping of
      # https://ghcr.io/v2/ through Docker Desktop's http.docker.internal:3128 with a hard ~15s timeout and no
      # retry; PC egress stalls fail the job ("Client.Timeout exceeded while awaiting headers", 11 runs 16-21.10).
      # Creds are client-side anyway: write them to a per-job DOCKER_CONFIG, buildx sends them per request.
      - name: ghcr auth (client-side config, no daemon ping)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"; echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$d/config.json"
      # root-cause t_a41372f5: docker-container driver = empty BuildKit on every run, base node:22-alpine
      # pulled fresh from CloudFront Docker Hub each time (breaks -> httpReadSeeker unexpected EOF). docker driver
      # takes layers from PC daemon store where ci/docker-image already built this Dockerfile.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      # root-cause t_0a4cae59: transport failures on PC egress (WSL NAT / Docker Desktop proxy) broke builds on
      # live GET of base layer (httpReadSeeker unexpected EOF -> failed to compute cache key) and push to ghcr
      # (oauth token EOF). driver=docker (t_a41372f5) removed empty BuildKit, but base image not in daemon store
      # is still pulled in one GET without retries. Pattern: 1) pull base separately with 4 attempts
      # (layers resume, no duplicates), as in pay-image; 2) build-push retry whole thing up to 4 times
      # only on registry transport errors (EOF / timeout / connection reset), not masking other failures.
      - name: pre-pull base (4 attempts, resumable layers)
        run: |
          B=$(sed -n 's/^FROM //p' Dockerfile | head -1)
          for n in 1 2 3 4; do docker pull -q "$B" && break; [ $n = 4 ] && exit 1; echo "pull $B: attempt $n failed, retry in $((n*20))s"; sleep $((n*20)); done
      # root-cause t_1b6fdb47: workflow_dispatch bypasses ci -> image with SyntaxError went to :latest, prod crashloop.
      # Server syntax checked before push on any event.
      - name: syntax gate (node --check server.mjs)
        run: |
          B=$(sed -n 's/^FROM //p' Dockerfile | head -1)
          # stdin, not bind-mount: Docker Desktop daemon can't see runner FS
          docker run --rm -i "$B" sh -c 'cat > /tmp/s.mjs && node --check /tmp/s.mjs' < functions/pay/server.mjs
      # preflight ghcr (image name + reachability)
      - name: preflight ghcr (image name + reachability)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if [ "$IMAGE" != "${IMAGE,,}" ]; then
            echo "::error::image name $IMAGE has uppercase letters; ghcr requires lowercase"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://ghcr.io/v2/) || code=000
          if [ "$code" != "401" ] && [ "$code" != "200" ]; then
            echo "::error::PC runner cannot reach https://ghcr.io/v2/ (HTTP $code): egress problem on the self-hosted runner, not the image"; exit 1
          fi
          echo "ghcr reachable (HTTP $code), image $IMAGE ok"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: build + push (retry on registry transport errors only)
        run: |
          set -e
          TAGS="${{ steps.meta.outputs.tags }}"
          args=(); while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          for n in 1 2 3 4; do
            if docker buildx build --push --provenance=false "${args[@]}" --cache-from "type=registry,ref=ghcr.io/${{ github.repository }}:latest" --cache-to type=inline .; then
              exit 0
            fi
            # check if error is a registry transport error (EOF / timeout / connection reset)
            # if not, fail immediately
            [ $n = 4 ] && exit 1
            echo "build-push: attempt $n failed, retry in $((n*20))s"; sleep $((n*20))
          done
      # Prune older versions of this image (best-effort)
      - name: prune old image versions
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          PKG="aicontent-factory"
          ids=$(gh api --paginate "/user/packages/container/$PKG/versions?per_page=100" \
                 --jq '.[] | [.id,.created_at] | @tsv' | sort -t$'\t' -k2,2r | awk -F'\t' 'NR>3{print $1}')
          for id in $ids; do
            gh api -X DELETE "/user/packages/container/$PKG/versions/$id" || true
          done
