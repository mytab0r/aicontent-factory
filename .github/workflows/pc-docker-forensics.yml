name: pc docker forensics
on:
  push:
    branches: ['ops/docker-forensics']
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: [self-hosted, release]
    timeout-minutes: 15
    steps:
      - name: v7 disk-guard full + log at 19.10 01:2x + tz
        run: |
          docker run --rm -v /run/desktop/mnt/host/d:/d:ro alpine:3.20 sh -c '
            echo "=== script"; cat -A /d/hermes-runner/disk-guard.ps1 | head -12; echo "=== vbs"; cat /d/hermes-runner/disk-guard.vbs
            echo "=== log 19.10 01:00-02:30"; grep -aE "2026-10-19T0(1|2):" /d/hermes-runner/disk-guard.log | head -40
            echo "=== tail"; tail -6 /d/hermes-runner/disk-guard.log; date -u
            echo "=== aggressive count"; grep -c "aggressive image prune" /d/hermes-runner/disk-guard.log; grep -a "aggressive" /d/hermes-runner/disk-guard.log | head -2'
          docker image inspect ghcr.io/ace-step/ace-step-1.5:latest -f 'created={{.Created}}'; docker inspect ace-step -f 'created={{.Created}} labels={{json .Config.Labels}}'
          docker images --format '{{.Repository}}:{{.Tag}}|{{.ID}}|{{.CreatedAt}}|{{.Size}}'
          docker ps -a --format '{{.Names}}|{{.Status}}|{{.CreatedAt}}'
