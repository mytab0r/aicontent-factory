name: pc docker forensics
on:
  push:
    branches: ['ops/docker-forensics']
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: [self-hosted, release]
    timeout-minutes: 15
    steps:
      - name: v6 runner-disk-guard + hermes-ops/janitor + docker-guard.log window
        run: |
          docker run --rm -v /run/desktop/mnt/host/c:/c:ro -v /run/desktop/mnt/host/d:/d:ro alpine:3.20 sh -c '
            for f in /d/hermes-runner/disk-guard.ps1 /c/Users/magic/hermes-ops/disk-guard.ps1 /c/dockerlocal/disk-guard.ps1 /c/Users/magic/tools/docker-guard.ps1 /c/dockerlocal/scratch-clean.sh; do echo "===== $f"; cat "$f" 2>&1; echo; done
            echo "===== ls"; ls -la --full-time /d/hermes-runner /c/Users/magic/hermes-ops/janitor /c/dockerlocal/janitor 2>&1 | head -60
            for f in /c/Users/magic/hermes-ops/janitor/* /c/dockerlocal/janitor/*; do case "$f" in *.log) continue;; esac; echo "===== $f"; head -c 4000 "$f"; echo; done
            for f in $(ls /d/hermes-runner/*.log /c/Users/magic/hermes-ops/janitor/*.log /c/dockerlocal/janitor/*.log /c/Users/magic/tools/docker-guard.log /c/Users/magic/hermes-ops/guard.log 2>/dev/null); do
              echo "===== $f window 18.10 22:00 - 19.10 06:00 (UTC or local)"; grep -aE "2026-10-1(8[T ]2[2-3]|9[T ]0[0-6])|1[89]\.10\.2026" "$f" | head -120
            done; true'
