name: release watchdog

# 10:00 UTC: нет ролика за сегодня на канале -> TG-алерт с причиной (по-русски).
# Run daily-video ещё идёт/в очереди -> сообщаем; сегодня не запускался -> dispatch сами.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  actions: write   # читать runs + workflow_dispatch daily-video
  contents: read

jobs:
  watch:
    runs-on: [self-hosted, release]  # ubuntu-latest: billing блокирует hosted-раннеры
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: check today's release
        working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: python3 watchdog.py
      - name: M13 cascade (public-шортс на скрытый long-form -> private)
        if: always()
        working-directory: pipeline
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_CH1_TOKEN_JSON: ${{ secrets.YT_CH1_TOKEN_JSON }}
        run: |
          python3 cascade_private.py
          # M18 (аудит 25.10): тот же каскад по каналу 1/2 (Economics of Owning) — там
          # 3 пустых public-плейлиста; без этой строки канал 1/2 вне каскада навсегда
          YOUTUBE_TOKEN_JSON="${YT_CH1_TOKEN_JSON}" python3 cascade_private.py
