name: build-ace-step-image
on:
  workflow_dispatch:
  push:
    paths:
      - deploy/gpu-pc/Dockerfile

jobs:
  build:
    runs-on: [self-hosted, pc]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/gpu-pc
          push: true
          tags: ghcr.io/mytab0r/ace-step-cu128:latest
      # ponytail: build on PC docker (self-hosted); layer cache stays local.
      # Remove only dangling layers and build cache older than 7d; live images untouched.
      - name: prune garbage
        if: always()
        run: docker image prune -f && docker builder prune -f --filter until=168h
