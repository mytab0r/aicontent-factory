name: build-ace-step-image
on:
  workflow_dispatch:
  push:
    paths:
      - deploy/gpu-pc/Dockerfile

jobs:
  build:
    runs-on: [self-hosted, pc]
    permissions:
      contents: read
      packages: write
    steps:
      # torch cu128 (~6 GB распакованный) не влезает в стандартный runner (~14 GB free)
      - name: free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/gpu-pc
          push: true
          tags: ghcr.io/mytab0r/ace-step-cu128:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
