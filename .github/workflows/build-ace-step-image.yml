name: build-ace-step-image
on:
  workflow_dispatch:
  push:
    paths:
      - deploy/gpu-pc/Dockerfile

jobs:
  build:
    runs-on: [self-hosted, pc]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # root-cause: t_831d9fd6 -- docker/login-action runs `docker login`, i.e. one daemon-side ping of
      # https://ghcr.io/v2/ through Docker Desktop's http.docker.internal:3128 with a hard ~15s timeout and no
      # retry; PC egress stalls fail the job ("Client.Timeout exceeded while awaiting headers", 11 runs 16-21.10).
      # Creds are client-side anyway: write them to a per-job DOCKER_CONFIG, buildx sends them per request.
      - name: ghcr auth (client-side config, no daemon ping)
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"; echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$d/config.json"
      # root-cause t_0a4cae59: build-push-action не ретраится; transport-обрыв egress ПК (EOF/timeout
      # к ghcr или CloudFront на слоях базы) валил джобу с наскока. Механика класса: pre-pull базы
      # с 4 попытками + buildx --push с 4 попытками (слои докачиваются, не дублируются).
      # root-cause: сборка образа шла при D: 28 ГБ (пол 40) — у этого пути не было гейта диска.
      - name: disk gate D (image ~16 GB lands in docker vhdx on D:)
        run: sh deploy/gpu-pc/disk_gate.sh d 16
      - name: pre-pull base (4 attempts, resumable layers)
        run: |
          B=$(sed -n 's/^FROM //p' deploy/gpu-pc/Dockerfile | head -1)
          for n in 1 2 3 4; do docker pull -q "$B" && break; [ $n = 4 ] && exit 1; echo "pull $B: попытка $n не удалась, повтор через $((n*20)) с"; sleep $((n*20)); done
      - name: build + push (retry on registry transport errors)
        run: |
          set -e
          for n in 1 2 3 4; do
            if docker buildx build --push \
                 -f deploy/gpu-pc/Dockerfile \
                 -t ghcr.io/mytab0r/ace-step-cu128:latest \
                 deploy/gpu-pc; then exit 0; fi
            [ $n = 4 ] && exit 1
            echo "build-push: попытка $n не удалась, повтор через $((n*20)) с"; sleep $((n*20))
          done
      # ponytail: build on PC docker (self-hosted); layer cache stays local.
      # Remove only dangling layers and build cache older than 7d; live images untouched.
      - name: prune garbage
        if: always()
        run: docker image prune -f && docker builder prune -f --filter until=168h
