name: oneoff-disk-top
on:
  push:
    branches: [ops/dtop]
  workflow_dispatch:
jobs:
  top:
    runs-on: [self-hosted, release]
    timeout-minutes: 15
    steps:
      - name: measure
        run: |
          docker run --rm -v /run/desktop/mnt/host/c:/c:ro alpine:3.20 sh -c '
            df -h /c | tail -1
            echo "== wsl vhdx =="
            find /c/Users -xdev -name "*.vhdx" -size +2G -printf "%s %p\n" 2>/dev/null | sort -rn | head -6
            echo "== user caches =="
            du -xsh /c/Users/*/AppData/Local/Temp /c/Users/*/AppData/Local/uv /c/Users/*/AppData/Local/pip /c/Users/*/AppData/Local/npm-cache /c/Users/*/AppData/Local/Docker /c/Users/*/AppData/Roaming/Docker* 2>/dev/null | sort -h | tail -10
            echo "== programdata =="
            du -xsh /c/ProgramData/* 2>/dev/null | sort -h | tail -6
          '
