name: oneoff-mirror-playwright
on:
  push:
    branches: [t_ef393676-gate-calib]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: mirror mcr -> ghcr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull mcr.microsoft.com/playwright:v1.64.1-noble
          docker tag mcr.microsoft.com/playwright:v1.64.1-noble ghcr.io/mytab0r/playwright-mirror:v1.64.1-noble
          docker push ghcr.io/mytab0r/playwright-mirror:v1.64.1-noble
