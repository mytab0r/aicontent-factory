name: runner-unbreak
# Пересоздание контейнера раннера aicontent-factory (deploy/gpu-pc/runner-swap.sh).
# t_5cdbb967: по расписанию раз в 6 ч — авто-свап, если RW-слой > 1 ГБ и раннер простаивает.
# Ручной запуск — принудительный свап (класс «зависший lease» 25.10 и т.п.).
# Свап идёт с раннера ci (не цель): у pc-acf метки pc+release, runs-on release мог попасть на цель.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "release | pc | both"
        default: "release"
        type: choice
        options: [release, pc, both]

concurrency:
  group: runner-unbreak
  cancel-in-progress: false

jobs:
  swap-release:
    if: github.event_name == 'schedule' || inputs.target != 'pc'
    runs-on: [self-hosted, ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: swap gh-runner-acf-release
        env:
          REG: ${{ secrets.RUNNER_REG_TOKEN }}
        run: bash deploy/gpu-pc/runner-swap.sh release ${{ github.event_name == 'schedule' && 'auto' || 'force' }}
  swap-pc:
    needs: swap-release
    if: always() && (github.event_name == 'schedule' || inputs.target != 'release')
    runs-on: [self-hosted, ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: swap gh-runner-aicontent-factory
        env:
          REG: ${{ secrets.RUNNER_REG_TOKEN }}
        run: bash deploy/gpu-pc/runner-swap.sh pc ${{ github.event_name == 'schedule' && 'auto' || 'force' }}
