name: runner-unbreak
# Класс «lease самохостед-раннера завис после смерти джобы/рекреации контейнера» (25.10: pc-acf-release
# busy=true при нуле активных джоб, вся очередь CI/release встала). Запускается ВРУЧНУЮ, пересоздаёт
# контейнер целевого раннера (новая регистрация по RUNNER_REG_TOKEN, новый lease).
# t_5cdbb967: свап идёт С ЧУЖОГО живого раннера (target=release -> джоба на pc; target=pc -> джоба на
# release): если lease целевого раннера зомби (busy=true без джоб), джоба на нём никогда не получит слот —
# дедлок «unbreak сам стоит в очереди за зомби». Оба раннера монтируют один docker.sock хоста.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "release | pc"
        default: "release"
        type: choice
        options: [release, pc]

jobs:
  recreate:
    runs-on: ${{ fromJSON(format('["self-hosted","{0}"]', inputs.target == 'release' && 'pc' || 'release')) }}
    timeout-minutes: 12
    steps:
      - name: recreate runner container (fresh registration)
        env:
          REG: ${{ secrets.RUNNER_REG_TOKEN }}
        run: |
          set -e
          if [ "${{ inputs.target }}" = "release" ]; then
            NAME=gh-runner-acf-release; RUNNER_NAME=pc-acf-release; LBL=release,ci; WORK=/tmp/runner/acf-release; VOL=gh-runner-acf-release-work
          else
            NAME=gh-runner-aicontent-factory; RUNNER_NAME=pc-acf; LBL=pc; WORK=/tmp/runner/aicontent-factory; VOL=gh-runner-aicontent-factory-work
          fi
          # t_5cdbb967 (критерий «пишущие пути вне слоя»): uv-кэш и xlv — вне RW-слоя.
          # t_fc4c96f9: кэши и workdir — bind-маунты на D: (D:\hermes-runner\docker-caches),
          # чтобы vhdx docker_data.vhdx не рос; + RUNNER_EPHEMERAL=1 (--ephemeral):
          # раннер сам deregister+выходит после джобы, janitor пересоздаёт с чистым RW.
          # Ротация кэшей — janitor purge_tmp (find /tmp -mmin +720), видит bind-пути хоста.
          mkdir -p /work/docker-caches/acf-uv-cache /work/docker-caches/xlv /work/docker-caches/runner-work/$(basename "$WORK")
          TMP="unbreak-$$"
          docker run -d --add-host run-actions-1-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-2-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-3-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-4-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-5-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-6-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-7-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-8-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-9-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-10-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-11-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-12-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-13-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-14-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-15-azure-eastus.actions.githubusercontent.com:140.82.114.21 --add-host run-actions-16-azure-eastus.actions.githubusercontent.com:140.82.114.21 --name "$TMP" --restart unless-stopped --dns 192.168.65.7 --dns 8.8.8.8 --dns 77.88.8.8 --cpus 4 --memory 4g \
            -e REPO_URL=https://github.com/mytab0r/aicontent-factory -e RUNNER_SCOPE=repo \
            -e RUNNER_NAME="$RUNNER_NAME" -e LABELS="$LBL" -e RUNNER_TOKEN="$REG" \
            -e RUNNER_WORKDIR="$WORK" -e CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/runner/data \
            -e DISABLE_AUTOMATIC_DEREGISTRATION=true \
            -e ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE=/opt/actions-archive-cache -v gh-actions-archive-cache:/opt/actions-archive-cache \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$NAME-data:/runner/data" \
            -v gh-runner-aicontent-factory-tools:/opt/hostedtoolcache \
            -v /work/docker-caches/acf-uv-cache:/tmp/acf-uv-cache \
            -v /work/docker-caches/xlv:/tmp/xlv \
            -v /work/docker-caches/runner-work/$(basename "$WORK"):$WORK \
            -e RUNNER_EPHEMERAL=1 \
            myoung34/github-runner:ubuntu-noble
          # дождаться регистрации нового
          for i in $(seq 1 60); do docker logs "$TMP" 2>&1 | grep -q "Listening for Jobs" && break; sleep 5; done
          # t_5cdbb967: порядок критичен. При target=pc джоба бежит ВНУТРИ пересоздаваемого
          # контейнера: rm старого = суицид джобы, шаги после не выполнятся. Поэтому
          # rename/сети — ДО rm; rm последним.
          docker rm -f "$NAME-old" || true
          docker rename "$NAME" "$NAME-old"
          docker rename "$TMP" "$NAME"
          for n in comfynet gpu-net; do docker network connect $n "$NAME" || true; done
          # старый контейнер (зомби-lease) уходит вместе с RW-слоем
          docker rm -f "$NAME-old" || true
          # t_5cdbb967: хвосты прошлых recreate/unbreak-свапов (recreate-117 висел 3.3 ГБ и
          # продолжал писать ~3 ГБ/ч в свой слой). К моменту этой строки свежая регистрация
          # уже в "Listening", все unbreak-*/recreate-* - зомби прошлых циклов.
          for z in $(docker ps -aq --filter "name=recreate-" --filter "name=unbreak-"); do docker rm -f "$z" || true; done
          docker ps --format "{{.Names}} {{.Size}}" | grep -E "$NAME|recreate-|unbreak-" || true
