name: probe guard net (t_c87cd624, ветка)
# Одноразовый зонд: только шаг guard (YouTube API) на release-раннере.
# Нужен, чтобы проверить гипотезу «ssl.SSLEOFError транзиентен и лечится ретраем» иначе
# ретрая не видно: полный daily-owning генерит и заливает видео. Удаляется до мержа.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, release]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        timeout-minutes: 5
      - name: install deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python pillow google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: token
        env:
          YT_CH1_TOKEN_JSON: ${{ secrets.YT_CH1_TOKEN_JSON }}
        run: |
          mkdir -p .state
          printf '%s' "$YT_CH1_TOKEN_JSON" > .state/youtube_token.json
      - name: guard
        working-directory: pipeline
        run: |
          rc=0; ../.venv/bin/python owning_channel.py guard || rc=$?
          echo "guard rc=$rc"
          rm -f ../.state/youtube_token.json
          [ $rc -eq 0 ] || [ $rc -eq 3 ]
