name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: [self-hosted, pc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install test deps
        run: pip install pillow gradio_client
      - name: run python tests
        run: |
          set -e
          TOK=smoke-$GITHUB_RUN_ID  # не литерал: редактор секретов агента заменял его на ***
          for f in pipeline/test_*.py; do
            echo "=== $f ==="
            python "$f"
          done
      - name: run pay.pxbt.app tests (wallet-verify + api + server)
        run: |
          set -e
          for f in test/test_*.mjs; do
            echo "=== $f ==="
            node "$f"
          done

  pay-image-smoke:
    runs-on: [self-hosted, pc]
    steps:
      - uses: actions/checkout@v4
      - name: build + run pay image (bind-mount ./data как в compose), healthz, /admin 403, запись счёта
        run: |
          set -e
          # self-hosted DooD: контейнеры живут на хосте, а не в раннере. Уникальное имя + уборка + доступ по IP
          N=pay-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT; trap "docker rm -f $N >/dev/null 2>&1 || true" EXIT
          docker build -q -f deploy/pay-page/Dockerfile -t pay-smoke .
          # root-owned каталог: контейнер должен упасть сразу с понятной ошибкой, а не 500 позже
          sudo mkdir -p /tmp/pay-root && sudo chown root:root /tmp/pay-root
          if timeout 20 docker run --rm -v /tmp/pay-root:/data pay-smoke 2> err.txt; then echo 'должен был упасть'; exit 1; fi
          cat err.txt
          grep -q 'chown 1000:1000' err.txt
          # путь из README: mkdir + chown 1000:1000
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name $N -v "$PWD/data:/data" -e PAY_API_TOKEN=$TOK pay-smoke
          H=http://$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $N):8080
          for i in $(seq 1 20); do curl -fs $H/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' $H/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' $H/admin)" = 403
          id=$(curl -fs -X POST $H/api/invoice -H 'authorization: Bearer smoketok' -d '{"amount":1}' | sed -n 's/.*"id":"\([a-z0-9]*\)".*/\1/p')
          test -n "$id"
          test "$(curl -s -o /dev/null -w '%{http_code}' $H/i/$id)" = 200
          sudo grep -q "invoice:$id" data/kv.json
          docker logs $N
