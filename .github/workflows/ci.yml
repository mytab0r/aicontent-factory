name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install test deps
        run: pip install pillow gradio_client
      - name: run python tests
        run: |
          set -e
          for f in pipeline/test_*.py; do
            echo "=== $f ==="
            python "$f"
          done
      - name: run pay.pxbt.app tests (wallet-verify + api)
        run: |
          set -e
          for f in test/test_*.mjs; do
            echo "=== $f ==="
            node "$f"
          done
