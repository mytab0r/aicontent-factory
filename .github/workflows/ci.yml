name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install test deps
        run: pip install pillow
      - name: run tests
        run: |
          set -e
          for f in pipeline/test_*.py; do
            echo "=== $f ==="
            python "$f"
          done
