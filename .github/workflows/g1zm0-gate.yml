name: g1zm0 content-id gate

# t_d53850f6: lofi грузится unlisted (daily-video, G1ZM0_GATE=1) -> здесь каждые 30 мин:
# claim -> private + перегенерация (dispatch daily-video, attempt+1); clean -> TG владельцу;
# approve=<video_id> -> public + плейлист. Логика: pipeline/g1zm0_gate.py.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      approve:
        description: "video_id для публикации (после проверки Studio -> Авторские права)"
        type: string
        default: ""

concurrency:
  group: g1zm0-gate
  cancel-in-progress: false

permissions:
  contents: write  # коммит .state/g1zm0_gate + маркеров одобрения
  actions: write   # dispatch daily-video для перегенерации

jobs:
  gate:
    runs-on: [self-hosted, release]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: gate step
        working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          APPROVE: ${{ inputs.approve }}
        run: |
          ls ../.state/g1zm0_gate/*.json >/dev/null 2>&1 || { echo "gate: записей нет"; exit 0; }
          [ -n "$YOUTUBE_TOKEN_JSON" ] || { echo "skip: нет YOUTUBE_TOKEN_JSON"; exit 0; }
          printf '%s' "$YOUTUBE_TOKEN_JSON" > ../.state/youtube_token.json
          python3 -m venv /tmp/g1zm0-venv && /tmp/g1zm0-venv/bin/pip install -q google-api-python-client google-auth-oauthlib
          /tmp/g1zm0-venv/bin/python g1zm0_gate.py ${APPROVE:+--approve "$APPROVE"}
      - name: commit gate state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -f .state/g1zm0_gate .state/g1zm0_approved 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: g1zm0 gate state [skip ci]"
          git pull --rebase -q || true
          git push
