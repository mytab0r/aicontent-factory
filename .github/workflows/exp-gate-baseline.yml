name: exp gate baseline (старый прод-трек)
on:
  push:
    branches: ["exp/gate-baseline"]
  workflow_dispatch:
    inputs:
      run_id:
        description: "run daily-video с артефактом video-<id>-0"
        default: "38559709263"
permissions:
  actions: read
  contents: read
jobs:
  gate:
    runs-on: [self-hosted, pc]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: gate на опубликованном треке
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ inputs.run_id || '38559709263' }}
        run: |
          uv venv .venv && uv pip install --python .venv/bin/python librosa numpy
          aid=$(curl -sH "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" | python3 -c "import json,sys;print(json.load(sys.stdin)['artifacts'][0]['id'])")
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -o a.zip "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip"
          python3 -c "import zipfile;zipfile.ZipFile('a.zip').extractall('a')"
          v=$(find a -name video.mp4 | head -1)
          mkdir -p out && ffmpeg -loglevel error -y -i "$v" -vn -ac 2 -ar 48000 out/old_track.wav
          ffmpeg -loglevel error -y -ss 452 -t 60 -i out/old_track.wav -codec:a libmp3lame -b:a 192k out/old_seam_60s.mp3
          .venv/bin/python pipeline/audio_gate.py out/old_track.wav --json out/gate_old.json || true
          rm out/old_track.wav
      - uses: actions/upload-artifact@v4
        with:
          name: gate-baseline
          path: out/
