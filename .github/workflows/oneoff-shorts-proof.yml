name: oneoff-shorts-proof
# videos.list по id через тот же OAuth-токен (YOUTUBE_TOKEN_JSON) — доказательство публикации Shorts.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "comma-separated video ids"
        required: true

# новый пуш в ветку эксперимента заменяет старый прогон, а не встаёт в очередь
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: [self-hosted, pc]
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@v3
        timeout-minutes: 5  # t_6758c86f: сетевой шаг не висит до таймаута джобы
      - name: videos.list
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          IDS: ${{ inputs.ids }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > tok.json
          uv venv -q .pv && uv pip install -q --python .pv/bin/python google-api-python-client google-auth
          .pv/bin/python - <<'PY' > shorts-proof.json
          import json, os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          yt = build("youtube", "v3", credentials=Credentials.from_authorized_user_file("tok.json"))
          r = yt.videos().list(part="snippet,contentDetails,status,fileDetails", id=os.environ["IDS"]).execute()
          print(json.dumps(r, ensure_ascii=False, indent=1))
          PY
          rm -f tok.json
          cat shorts-proof.json
      - uses: actions/upload-artifact@v4  # artifact-ok: логи прогона; доставка результата вне артефактов
        timeout-minutes: 15  # t_6758c86f: сетевой шаг не висит до таймаута джобы
        with:
          retention-days: 1  # t_9d452170: доставка вне артефактов (TG/git); квота storage 500MB
          name: shorts-proof
          path: shorts-proof.json
