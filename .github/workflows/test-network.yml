name: test network
on:
  workflow_dispatch:
  push:
    branches: [aicontent-factory/t_ca65473e-aicontent-factory-tls-ssleof-www.googlea]

jobs:
  test:
    runs-on: [self-hosted, release]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        timeout-minutes: 5
      - name: install deps
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: test ipv4 connectivity
        run: |
          echo "=== Testing IPv4 connectivity to googleapis ==="
          curl -4 -v --max-time 10 https://www.googleapis.com/ 2>&1 | head -30
          echo "=== Testing IPv6 connectivity to googleapis ==="
          curl -6 -v --max-time 10 https://www.googleapis.com/ 2>&1 | head -30 || echo "IPv6 failed (expected)"
          echo "=== Testing DNS resolution ==="
          getent ahosts www.googleapis.com
      - name: test python socket.getaddrinfo
        working-directory: pipeline
        run: ../.venv/bin/python test_ipv4_connectivity.py
      - name: test full googleapiclient stack
        working-directory: pipeline
        run: ../.venv/bin/python test_google_api.py
      - name: test direct SSL to IPv4
        working-directory: pipeline
        run: ../.venv/bin/python test_ssl_direct.py
