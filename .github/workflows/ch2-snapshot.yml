name: ch2 snapshot (analytics)

# Снапшот по роликам канала @OwningItMath (ch2 живёт плейлистами на нём): просмотры/подписки/показы/CTR/
# удержание/источник трафика. Ежедневно 12:30 UTC + на PR. Только чтение, публикации нет.
on:
  schedule:
    - cron: "30 12 * * *"  # ежедневный снапшот (t_f807dc99)
  workflow_dispatch: {}
  pull_request:
    paths: [pipeline/ch2_snapshot.py, .github/workflows/ch2-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: [self-hosted, release]
    timeout-minutes: 5
    env:
      YT_CH1_TOKEN_JSON: ${{ secrets.YT_CH1_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: snapshot
        working-directory: pipeline
        run: python3 ch2_snapshot.py
      - name: upload snapshot
        if: always()
        timeout-minutes: 2
        continue-on-error: true  # root-cause: t_f807dc99 (снапшот уже в логе шага; артефакт — копия)
        uses: actions/upload-artifact@v4  # artifact-ok: копия снапшота, источник истины — лог шага
        with:
          name: ch2-snapshot-${{ github.run_id }}
          path: reports/ch2_snapshot/*.md
          retention-days: 1
