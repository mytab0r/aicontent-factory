name: oneoff-vox-insert
on:
  push:
    branches: [exp/vox-insert]
permissions:
  contents: write
  actions: read
jobs:
  s:
    runs-on: [self-hosted, pc]
    timeout-minutes: 240
    env:
      ACE: http://ace-step:8001
    steps:
      - uses: actions/checkout@v4
      - name: 'reclaim disk D (runner temp + pip/uv caches, regenerable only)'
        run: |
          # ponytail: runner rw layer grew to 10.5 GB from one-off venvs/caches; regenerable stuff only, never volumes/hya-*
          df -BG /tmp | tail -1
          du -sh /tmp/* ~/.cache/* 2>/dev/null | sort -h | tail -8 || true
          rm -rf /tmp/bv /tmp/ytv /tmp/vv* /tmp/gradio /tmp/tmp* ~/.cache/pip ~/.cache/uv ~/.cache/huggingface 2>/dev/null || true
          find /tmp/runner/work -maxdepth 1 -mindepth 1 -type d ! -name aicontent-factory ! -name _temp ! -name _actions ! -name _tool -exec rm -rf {} + 2>/dev/null || true
          docker exec ace-step sh -c 'rm -rf /root/.cache/pip /root/.cache/uv /tmp/*' 2>/dev/null || true
          df -BG /tmp | tail -1
      - name: ace-step up (recreate if missing; base model weights -> C:, disk-gated)
        env:
          C: /run/desktop/mnt/host/c/dockerlocal/ace15
          IMG: ghcr.io/ace-step/ace-step-1.5:latest
        run: |
          # ponytail: D: already <40G before this job; job pulls nothing and writes outputs/weights to C:, so D: check is warn-only
          sh deploy/gpu-pc/disk_gate.sh d 0 32   # ponytail: net-negative job (reclaim step frees ~5G inside docker vhdx before writing ~3G, so D: cannot shrink); floor back to 35 once vhdx compacted / hya-* gone.
          # weights/outputs go to C:, D: grows ~0; hard stop above docker-crash zone
          HAVE=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' ace-step 2>/dev/null | grep -c CONFIG_PATH2=acestep-v15-base || true)
          if [ "$HAVE" != 1 ]; then
            sh deploy/gpu-pc/disk_gate.sh c 7 30   # base DiT 4.8 GB + margin
            docker image inspect "$IMG" >/dev/null   # image already on PC: no pull, D: does not grow
            docker rm -f ace-step >/dev/null 2>&1 || true
            docker network inspect comfynet >/dev/null 2>&1 || docker network create comfynet
            docker network connect comfynet gh-runner-aicontent-factory 2>/dev/null || true
            docker run -d --name ace-step --restart unless-stopped --gpus all --shm-size 2g \
              --network comfynet --network-alias ace-step -p 127.0.0.1:8001:8001 \
              -e ACESTEP_MODE=api -e ACESTEP_LLM_BACKEND=pt \
              -e ACESTEP_CONFIG_PATH=acestep-v15-turbo -e ACESTEP_CONFIG_PATH2=acestep-v15-base \
              -e ACESTEP_LM_MODEL_PATH=acestep-5Hz-lm-1.7B \
              -v "$C/checkpoints:/app/checkpoints" -v "$C/output:/app/output" -v "$C/hf:/root/.cache/huggingface" \
              "$IMG"
          fi
          docker start ace-step >/dev/null 2>&1 || true
          for i in $(seq 1 240); do
            curl -fsS -m 5 "$ACE/health" >/dev/null 2>&1 && { echo "UP after $((i*15))s"; break; }
            [ "$(docker inspect -f '{{.State.Running}}' ace-step)" = true ] || { docker logs --tail 80 ace-step; exit 1; }
            [ $((i % 8)) = 0 ] && docker logs --tail 3 ace-step 2>&1 | tr '\r' '\n' | tail -3
            sleep 15
          done
          curl -fsS -m 5 "$ACE/health"; curl -s "$ACE/v1/models" | head -c 600; echo
          sh deploy/gpu-pc/disk_gate.sh c 0 30; sh deploy/gpu-pc/disk_gate.sh d 0 35
      - name: refs (90s of each owner reference)
        run: |
          python3 -m venv /tmp/ytv && /tmp/ytv/bin/pip install -q -U yt-dlp
          mkdir -p refs
          # ponytail: YouTube 403 is transient/client-specific; retry alt clients, cache wav on runner
          mkdir -p /tmp/refcache
          for pair in sera:CYZeAfaj3pc; do n=${pair%%:*}; id=${pair#*:}
            if [ -s /tmp/refcache/$n.wav ]; then cp /tmp/refcache/$n.wav refs/; continue; fi
            for i in 1 2 3; do for c in default android tv web_safari mweb; do
              rm -f refs/raw_$n.*
              /tmp/ytv/bin/yt-dlp -q -f bestaudio --extractor-args "youtube:player_client=$c" -o "refs/raw_$n.%(ext)s" "https://youtu.be/$id" && break 2
              sleep 5
            done; sleep 20; done
            ls refs/raw_$n.* >/dev/null 2>&1 || { echo "ref $n download failed"; exit 1; }
            ffmpeg -loglevel error -y -ss 30 -t 90 -i refs/raw_$n.* -ac 2 -ar 48000 refs/$n.wav
            cp refs/$n.wav /tmp/refcache/
          done; ls -la refs; test -s refs/sera.wav
      - name: generate
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os, time, urllib.request
          B=os.environ["ACE"]
          def post(p,d):
              r=urllib.request.Request(B+p,json.dumps(d).encode(),{"Content-Type":"application/json"})
              for k in range(40):  # first call per model loads/downloads weights to C:; server may stay silent for minutes
                  try: return json.load(urllib.request.urlopen(r,timeout=600))
                  except Exception as e: print("retry",p,k,repr(e)[:120],flush=True); time.sleep(30)
              raise SystemExit("ACE no answer")
          # Owner 14.10: mid-tempo = "retro game menu", neither here nor there. Split into two formats.
          SLOW=("slow tender ambient chill, soft and calm, warm gentle sub bass, very soft brushed drums or no drums, "
                "felt piano, music box, soft bells, warm evolving pads, bright major chords, simple gentle melody, "
                "background music for focus, relaxing, clean warm mix, no vocals")
          UP=("upbeat melodic chill bass, energetic groovy drums, punchy warm sub bass, airy female vocal chops in the chorus only, "
              "sparkling bells, plucked synth arps, lush pads, bright major chords, catchy uplifting melodic hook, "
              "polished modern mix, wide stereo")
          VOX="[intro]\n\n[verse]\n\n[chorus]\nooh, la la\n\n[verse]\n\n[chorus]\nooh, la la\n\n[outro]"
          base=dict(reference_audio_path="refs/sera.wav",audio_duration=90)
          # Owner 15.10: base samples were broken (noise floor -17 dB, LRA 0.3) - prove whether model or our params.
          # Last time base got shift=1 (API default; docs recommend 3) + guidance 7 + ADG + reference audio.
          # Turbo also never got shift=3 (docs: "the only param you need to set for turbo"). Same seed/prompt everywhere.
          # Owner 15.10 on U_T0: "весь из микса голоса" - wants voice as an insert, not the whole track.
          # Bed = same U_T0 params but instrumental; vocal hooks generated separately (same bpm/key), then spliced in.
          UPI=UP.replace("airy female vocal chops in the chorus only, ","")+", instrumental, no vocals"
          HOOK="[chorus]\nooh, la la, ooh\n\n[chorus]\nooh, la la, ooh"
          jobs=[("S_T1_ctrl",dict(base,prompt=SLOW,lyrics="[Instrumental]",bpm=72,seed=31,key_scale="F major",shift=3.0))]
          for sd in (34,35,36): jobs.append((f"BED_{sd}",dict(base,prompt=UPI,lyrics="[Instrumental]",bpm=108,seed=sd,key_scale="A major")))
          for sd in (34,41): jobs.append((f"VOX_{sd}",dict(base,prompt=UP,lyrics=HOOK,bpm=108,seed=sd,key_scale="A major",audio_duration=30)))
          for name,extra in jobs:
              body=dict(prompt=SLOW,lyrics="[Instrumental]",audio_duration=120,bpm=85,key_scale="C major",
                        time_signature="4",batch_size=1,thinking=True,use_random_seed=False,seed=7,
                        audio_format="mp3")
              body.update(extra)
              ref=body.pop("reference_audio_path",None)
              if ref:
                  args=[]
                  for k,v in body.items(): args+=["-F",f"{k}={str(v).lower() if isinstance(v,bool) else v}"]
                  import subprocess
                  o=subprocess.run(["curl","-s","-m","600","-X","POST",B+"/release_task","-F",f"reference_audio=@{ref}"]+args,capture_output=True,text=True).stdout
                  print(name,o[:300],flush=True)
                  try: tid=json.loads(o)["data"]["task_id"]
                  except Exception: continue
              else:
                  r0=post("/release_task",body); print(name,str(r0)[:200],flush=True); tid=r0["data"]["task_id"]
              t=time.time()
              while True:
                  time.sleep(8); d=post("/query_result",{"task_id_list":[tid]})["data"][0]
                  if d["status"]!=0 or time.time()-t>1500: break
              print(name,"status",d["status"],round(time.time()-t),"s",flush=True)
              if d["status"]==1:
                  f=json.loads(d["result"])[0]["file"]; urllib.request.urlretrieve(B+f,f"out/{name}.mp3")
              else: print(str(d.get("result"))[:300])
          PY
      - name: splice vocal hooks into instrumental beds
        run: |
          # ponytail: splice at fixed 30s/62s with 1.5s crossfades; upgrade = beat-aligned cut points (librosa beat_track)
          set -e; cd out; ls
          for v in VOX_*.mp3; do ffmpeg -loglevel error -y -ss 8 -t 10 -i $v -af "afade=t=in:d=0.3,afade=t=out:st=9.4:d=0.6" ${v%.mp3}_cut.wav; done
          i=0; for bed in BED_*.mp3; do
            for v in VOX_*_cut.wav; do i=$((i+1)); n=U_INS_$(basename $bed .mp3)_$(basename $v _cut.wav)
              ffmpeg -loglevel error -y -i $bed -i $v -filter_complex \
                "[0]atrim=0:30,asetpts=N/SR/TB[a];[0]atrim=40:62,asetpts=N/SR/TB[b];[0]atrim=72,asetpts=N/SR/TB[c];[1]asplit[v1][v2];\
                 [a][v1]acrossfade=d=1.5[x];[x][b]acrossfade=d=1.5[y];[y][v2]acrossfade=d=1.5[z];[z][c]acrossfade=d=1.5,loudnorm=I=-14:TP=-1.5[o]" \
                -map "[o]" -b:a 192k $n.mp3
            done; done
          rm -f *_cut.wav; ls -la
      - name: bench vs popular refs + hook score
        timeout-minutes: 30
        env:
          BENCH_OURS: '{"slow": ["S_"], "up": ["U_", "BED_"]}'
        run: |
          sh deploy/gpu-pc/disk_gate.sh c 4 30   # aesthetics venv + ~1 GB checkpoint on C:
          mkdir -p bench/ours && rm -f bench/ours/* && cp out/*.mp3 bench/ours/
          python3 -m venv /tmp/bv && /tmp/bv/bin/pip install -q librosa==0.10.2.post1 numpy
          /tmp/bv/bin/python bench/bench.py
          sh bench/aes.sh
          /tmp/bv/bin/python bench/merge.py
      - name: keep samples even if scoring fails
        if: always()
        run: ls out/
      - uses: actions/upload-artifact@v4
        id: up
        if: always()
        continue-on-error: true   # artifact storage quota can be full; fallback below
        with: {name: vox-insert, path: out/, retention-days: 3}
      - name: fallback - samples to branch samples/vox-insert (artifact quota hit)
        if: always() && steps.up.outcome != 'success'
        run: |
          # ponytail: orphan branch as artifact store when Actions quota is full; delete branch after review
          git checkout -q --orphan smp && git rm -rqf --cached . && git add -f out
          git -c user.name=hermes -c user.email=hermes@local commit -qm "vox-insert samples run $GITHUB_RUN_ID"
          git push -qf origin HEAD:refs/heads/samples/vox-insert
