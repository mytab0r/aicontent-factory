name: post analytics 48h

# 12:00 UTC: видео, опубликованные 48–72 ч назад -> удержание + CTR vs медиана канала -> TG-отчёт.
# Ниже медианы по любой метрике = флаг «разбор» (t_3017f17a). Только stdlib, без установки пакетов.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      window_h:
        description: "окно часов 'lo,hi' (пусто = 48,72; только ручной прогон)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  report:
    runs-on: [self-hosted, release]  # ubuntu-latest: billing блокирует hosted-раннеры
    timeout-minutes: 10  # t_79ec2527: setup-uv сам до 5 мин (макс 5.0 в daily-video) — сумма шагов < лимита джобы
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
      WINDOW_H: ${{ inputs.window_h }}  # cron: пусто -> 48,72
    steps:
      - uses: actions/checkout@v4
      - name: scope probe (YouTube Analytics API реальным вызовом)
        working-directory: pipeline
        run: python3 08_post_analytics.py --probe
      - name: 48h report -> TG
        working-directory: pipeline
        run: python3 08_post_analytics.py
      - uses: astral-sh/setup-uv@v3
        timeout-minutes: 5  # t_6758c86f: сетевой шаг не висит до таймаута джобы
        with:
          enable-cache: true
          cache-local-path: /tmp/acf-uv-cache
      - name: 28d report (views/watch time + показы и CTR обложек) -> лог
        working-directory: pipeline
        run: |
          # Reporting API channel_reach_basic_a1 (Analytics v2 thumbnail-метрики = 400). Сбой reach = столбцы н/д, не красный job.
          mkdir -p ../.state
          printf '%s' "$YOUTUBE_TOKEN_JSON" > ../.state/youtube_token.json
          uv venv -q ../.venv-report
          for i in 1 2 3; do UV_HTTP_TIMEOUT=120 uv pip install --quiet --python ../.venv-report/bin/python google-api-python-client google-auth-oauthlib && break; [ $i = 3 ] && exit 1; sleep 30; done
          ../.venv-report/bin/python 06_report.py
          rm -f ../.state/youtube_token.json
