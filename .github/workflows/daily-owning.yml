name: daily owning short (S1 ch1)
# S1 ch1 «Economics of Owning» (@OwningItMath): нарративный Short = скрипт 9router + edge-tts + инфографика.
# Публикация только при vars.OWNING_PUBLISH == '1' (ставится после вердикта владельца по сэмплу, sample gate).
# guard: не больше owning_channel.MAX_PER_DAY загрузок в сутки (повтор слота = no-op).
on:
  schedule:
    - cron: "0 15,21 * * *"  # 2 слота/день: US утро и вечер
  workflow_dispatch: {}

concurrency:
  group: daily-owning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, release]
    timeout-minutes: 30
    env:
      ROUTER_BASE_URL: https://9router.pxbt.app/v1
      ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
      CHANNEL: owning
      PUBLISH: ${{ vars.OWNING_PUBLISH }}
      LOCALIZE: ${{ vars.LOCALIZE }}  # '1' = ES/pt-BR localizations + субтитры (localize.py), иначе no-op
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: install deps
        run: |
          command -v ffmpeg || { sudo apt-get update -y && sudo apt-get install -y ffmpeg; }
          uv venv .venv
          uv pip install --python .venv/bin/python pillow edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: token
        env:
          YT_CH1_TOKEN_JSON: ${{ secrets.YT_CH1_TOKEN_JSON }}
        run: |
          mkdir -p .state
          printf '%s' "$YT_CH1_TOKEN_JSON" > .state/youtube_token.json
      - name: guard (лимит загрузок в сутки)
        id: guard
        working-directory: pipeline
        run: |
          rc=0; ../.venv/bin/python owning_channel.py guard || rc=$?
          [ $rc -eq 0 ] && echo "go=1" >> "$GITHUB_OUTPUT"
          [ $rc -eq 3 ] && echo "go=0" >> "$GITHUB_OUTPUT"
          [ $rc -eq 0 ] || [ $rc -eq 3 ]  # прочее (токен/API) = красный run, не тихий пропуск
      - name: 01 idea (script)
        if: steps.guard.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python 01_idea.py
      - name: 04 render (tts + infographic)
        if: steps.guard.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python owning_channel.py render
      - name: spokes (Pinterest/X/блог/TG из того же скрипта, t_705386b0)
        if: steps.guard.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python spokes.py
      - name: 05 publish (только после sample gate)
        if: steps.guard.outputs.go == '1' && env.PUBLISH == '1'
        working-directory: pipeline
        run: ../.venv/bin/python 05_publish.py
      - name: commit rotation state
        if: steps.guard.outputs.go == '1'
        run: |
          git config user.name "aicontent-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .state/owning_idx.txt
          git diff --cached --quiet || git commit -m "chore: advance owning rotation [skip ci]"
          git pull --rebase -q && git push || true  # root-cause: t_f95a06da
      - name: upload artifact
        if: steps.guard.outputs.go == '1'
        continue-on-error: true  # квота artifact storage репо (22:03 18.10) не должна валить выпуск  # root-cause: t_f95a06da
        uses: actions/upload-artifact@v4  # artifact-ok: логи прогона; доставка результата вне артефактов
        with:
          name: owning-${{ github.run_id }}
          path: |
            runs/*/video.mp4
            runs/*/idea.json
            runs/*/spokes/*
          retention-days: 14
      - name: cleanup token
        if: always()
        run: rm -f .state/youtube_token.json
