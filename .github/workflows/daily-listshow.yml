name: listshow long-form (S1 ch2)
# S1 ch2 long-form: 1 list-видео/день (10-11 мин, 1080p) + 3 Shorts из него (pipeline/listshow_channel.py).
# Флаг: vars.LIST2D == '1' включает режим; снять флаг = откат (все шаги no-op, What if остаётся как был).
# Публикация: тот же канал ch1 (@OwningItMath), отдельный плейлист «Fascinating Lists»; квота: 4 videos.insert из 100/сутки.
on:
  schedule:
    - cron: "30 16 * * *"  # 1 выпуск/день, US утро; whatif идёт в 18:00 UTC
  workflow_dispatch:
    inputs:
      dryrun:
        description: "сухой прогон launch-гейта: upload private + автосверка, без гейта и без ротации (t_f807dc99)"
        type: boolean
        default: false

concurrency:
  group: daily-listshow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, release]
    timeout-minutes: 90
    env:
      ROUTER_BASE_URL: https://9router.pxbt.app/v1
      ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
      LIST2D: ${{ vars.LIST2D }}
      CH2_PRIVACY: ${{ inputs.dryrun && 'private' || 'public' }}
    steps:
      - name: flag
        id: flag
        run: |
          if [ "$LIST2D" = "1" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "listshow disabled (vars.LIST2D != 1)"; fi
      - uses: actions/checkout@v4
        if: steps.flag.outputs.go == '1'
      - uses: astral-sh/setup-uv@v3
        if: steps.flag.outputs.go == '1'
      - name: install deps
        if: steps.flag.outputs.go == '1'
        run: |
          command -v ffmpeg || { sudo apt-get update -y && sudo apt-get install -y ffmpeg; }
          uv venv .venv
          uv pip install --python .venv/bin/python pillow edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: self-check
        if: steps.flag.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python test_listshow.py
      - name: idea (list script via 9router)
        if: steps.flag.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python listshow_channel.py idea
      - name: render (tts + code-2D long + shorts)
        if: steps.flag.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python listshow_channel.py render
      # P19: гейт до заливки (целостность, чёрный кадр, формат шортса, обложка). FAIL = не публиковать.
      - name: quality gate video (FAIL = не публиковать)
        if: steps.flag.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python quality_gate.py --video
      # t_f807dc99: без GO гейта запуска ch2 — выход без upload (рендер/QA остаются, токен не пишется).
      - name: launch gate (NO-GO = без upload)
        id: gate
        if: steps.flag.outputs.go == '1'
        run: |
          if [ "$CH2_PRIVACY" = "private" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; echo "dryrun: private upload, гейт не нужен"
          elif python3 scripts/launch_gate.py ch2-whatif; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::launch gate NO-GO: upload ch2 пропущен (reports/products/ch2-whatif.launch.md)"; fi
      - name: token
        if: steps.gate.outputs.go == '1'
        env:
          YT_CH1_TOKEN_JSON: ${{ secrets.YT_CH1_TOKEN_JSON }}
        run: |
          mkdir -p .state
          printf '%s' "$YT_CH1_TOKEN_JSON" > .state/youtube_token.json
      - name: publish (long + 3 Shorts в плейлист)
        if: steps.gate.outputs.go == '1'
        working-directory: pipeline
        run: ../.venv/bin/python listshow_channel.py publish
      - name: verify dryrun (title/privacy/playlist/длина)
        if: steps.gate.outputs.go == '1' && inputs.dryrun
        working-directory: pipeline
        run: ../.venv/bin/python listshow_channel.py verify
      - name: commit rotation state
        if: steps.flag.outputs.go == '1' && !inputs.dryrun
        run: |
          git config user.name "aicontent-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .state/listshow_idx.txt
          git diff --cached --quiet || git commit -m "chore: advance listshow rotation [skip ci]"
          git pull --rebase -q && git push || true  # root-cause: t_f95a06da (rebase-гонка ежедневных воркфлоу)
      - name: upload artifact
        if: steps.flag.outputs.go == '1' && always()
        continue-on-error: true  # root-cause: t_f95a06da (артефакт не обязан существовать)
        uses: actions/upload-artifact@v4  # artifact-ok: логи прогона; доставка результата вне артефактов
        with:
          name: listshow-${{ github.run_id }}
          path: |
            runs/*/idea.json
            runs/*/render.json
            runs/*/published.json
          retention-days: 14
      - name: cleanup token
        if: always()
        run: rm -f .state/youtube_token.json
