name: G1zm0 A/B refpool samples

on:
  workflow_dispatch:
    inputs:
      n:
        description: "how many variants (refs)"
        default: "4"
      seg_sec:
        description: "segment length, s"
        default: "60"

permissions:
  contents: read

concurrency:
  group: ab-refpool
  cancel-in-progress: false

jobs:
  samples:
    runs-on: [self-hosted, release]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: astral-sh/setup-uv@v3

      - name: install deps
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          uv venv .venv
          uv pip install --python .venv/bin/python pillow gradio_client numpy yt-dlp
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"  # refpool.py зовёт bare yt-dlp через subprocess

      - name: reference pool (download missing refs)
        run: |
          mkdir -p /tmp/acf-refpool
          cd pipeline && ../.venv/bin/python refpool.py --ensure && for e in $(../.venv/bin/python - <<'PY'
          import refpool
          print(" ".join(x[0] for x in refpool.POOL))
          PY
          ); do ../.venv/bin/python -c "import refpool,sys; refpool.ensure_ref({'yt_id':sys.argv[1]})" "$e"; done

      - name: A/B candidates (4 refs, no publish)
        working-directory: pipeline
        env:
          ACE15_ENDPOINT: http://ace-step:8001  # ACE-Step 1.5 REST на ПК (comfynet)
        run: |
          ../.venv/bin/python ab_samples.py --n "${{ inputs.n || 4 }}" --seg-sec "${{ inputs.seg_sec || 60 }}" --out ../runs/ab_$(date -u +%Y%m%d_%H%M%S)

      - name: upload A/B artifact
        continue-on-error: true  # квота storage может быть исчерпана — доставка идёт через TG
        uses: actions/upload-artifact@v4
        with:
          name: ab-refpool-${{ github.run_id }}
          path: |
            runs/ab_*/ab_*.mp3
            runs/ab_*/manifest.json
            runs/ab_*/ab_LOCK.json
          retention-days: 14

      - name: deliver to Telegram (без претензий, только факты)
        if: ${{ always() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: |
          set +e
          if [ -z "${TG_BOT_TOKEN}" ]; then echo "TG_BOT_TOKEN empty - skip"; exit 0; fi
          TEXT="A/B G1zm0: 4 варианта на разных эталонах пула — выбери лучший. Публикация заблокирована до твоего вердикта."
          RESP=$(curl -sS -m 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" -d message_thread_id="${TG_THREAD_ID}" -d text="${TEXT}")
          echo "TG sendMessage: ${RESP:0:300}"
          for f in runs/ab_*/ab_*.mp3; do
            RESP=$(curl -sS -m 120 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendAudio" \
              -F chat_id="${TG_CHAT_ID}" -F message_thread_id="${TG_THREAD_ID}" \
              -F audio="@${f}")
            echo "TG sendAudio ${f}: $(echo "${RESP}" | head -c 200)"
          done
          curl -sS -m 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" -d message_thread_id="${TG_THREAD_ID}" \
            -d text="Эталоны (manifest): $(cat runs/ab_*/manifest.json | head -c 1500)"
          exit 0  # доставка не должна валить run; файлы останутся в runs/ для повторной попытки

      - name: deliver via git branch (fallback, мимо artifacts и TG)
        if: ${{ always() }}
        run: |
          set +e
          D=$(ls -d runs/ab_* 2>/dev/null | tail -1)
          [ -z "$D" ] && { echo "no ab dir"; exit 0; }
          git config user.email "bot@users.noreply.github.com"
          git config user.name "acf-bot"
          git fetch origin delivery/ab-refpool || true
          git checkout -B delivery/ab-refpool origin/delivery/ab-refpool 2>/dev/null || git checkout -B delivery/ab-refpool
          mkdir -p samples
          cp "$D"/ab_*.mp3 "$D"/manifest.json samples/ 2>/dev/null
          git add samples && git commit -m "ab samples $(date -u +%Y%m%d_%H%M%S)" && git push origin delivery/ab-refpool && echo "PUSHED to delivery/ab-refpool" || echo "push failed"

