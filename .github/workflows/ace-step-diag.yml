name: ace-step diag (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, release]
    timeout-minutes: 10
    steps:
      - name: env probe
        run: |
          docker exec ace-step sh -c '''
          echo D=/app/output/bank/anime-lofi; d=/app/output/bank/anime-lofi; ls "$d" | grep -c mp3; ls "$d/broken" 2>/dev/null | grep -c mp3
          '''
