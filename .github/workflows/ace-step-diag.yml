name: ace-step diag (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, release]
    timeout-minutes: 10
    steps:
      - name: counts
        run: docker exec ace-step sh -c 'cd /app/output/bank/anime-lofi && echo root_mp3=$(ls -1 *.mp3 2>/dev/null | wc -l) broken_mp3=$(ls -1 broken/*.mp3 2>/dev/null | wc -l) && ls -1 broken/*.mp3 2>/dev/null'
