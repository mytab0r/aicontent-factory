name: ace-step diag (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, release]
    timeout-minutes: 10
    steps:
      - name: restore intact quarantined + groups
        run: |
          d=/app/output/bank/anime-lofi
          docker exec ace-step sh -c "cd $d/broken && for f in *.mp3; do s=\${f%.mp3}; dur=\$(ffprobe -v error -show_entries format=duration -of csv=p=0 \$f); case \$dur in 17[5-9]*|18[0-5]*) mv -f \$s.mp3 \$s.json $d/ && echo restored \$s;; *) echo keep-broken \$s \$dur;; esac; done"
          docker exec ace-step sh -c "cd $d && for j in *.json; do grep -o '[0-9]* BPM, [A-G][#b]* m[a-z]*' \$j | head -1; done | sort | uniq -c"
