name: ace-step diag (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, release]
    timeout-minutes: 10
    steps:
      - name: where
        run: |
          docker exec ace-step sh -c "d=/app/output/bank/anime-lofi; echo bank=$(ls $d/*.mp3 2>/dev/null | wc -l) broken=$(ls $d/broken/*.mp3 2>/dev/null | wc -l); for n in 1792646909_203763213_mix_00_1 1792691491_1132123150_mix_00_1 1792769951_105801872_mix_03_0; do ls $d/$n.mp3 $d/broken/$n.mp3 2>/dev/null; done; cd $d && for j in *.json; do grep -o '[0-9]* BPM, [A-G][#b]* m[a-z]*' $j | head -1; done | sort | uniq -c; echo used14=$(wc -l < /app/output/.state/bank_used.jsonl 2>/dev/null || echo nostate)"
