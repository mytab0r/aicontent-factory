name: oneoff-minimax-migrate
# t_40bfcd35 R4: docker-тома minimax-weights/minimax-out -> bind C:\dockerlocal\minimax(-out).
# Копия без перезаписи (cp -an), затем докачка недостающего hf download (resume), затем проверка и удаление томов.
on:
  push:
    branches: [exp/minimax-migrate]
    paths: [.github/workflows/oneoff-minimax-migrate.yml]
  workflow_dispatch: {}
concurrency:
  group: oneoff-minimax-migrate
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: [self-hosted, pc]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inventory
        run: |
          docker volume ls --format '{{.Name}}' | grep -E '^minimax-' || echo "томов minimax нет"
          for v in minimax-weights minimax-out; do
            docker volume inspect $v >/dev/null 2>&1 || continue
            echo "users of $v: $(docker ps -a --filter volume=$v --format '{{.Names}}' | tr '\n' ' ')"
            docker run --rm -v $v:/v:ro alpine:3.20 du -sh /v
          done
          docker run --rm -v /run/desktop/mnt/host/c:/c:ro alpine:3.20 df -h /c | tail -1
      - name: Copy volumes to C (no overwrite)
        run: |
          set -e
          C=/run/desktop/mnt/host/c/dockerlocal
          for p in "minimax-weights minimax" "minimax-out minimax-out"; do
            set -- $p; v=$1; d=$2
            docker volume inspect $v >/dev/null 2>&1 || { echo "$v нет — пропуск"; continue; }
            gb=$(docker run --rm -v $v:/v:ro alpine:3.20 du -sk /v | awk '{print int($1/1048576)+1}')
            bash deploy/gpu-pc/disk_gate.sh c "$gb"
            docker run --rm -v $v:/v:ro -v $C:/c alpine:3.20 sh -c "mkdir -p /c/$d && cp -an /v/. /c/$d/ && du -sh /c/$d"
          done
      - name: Resume download into C (only missing parts)
        run: |
          set -e
          W=/run/desktop/mnt/host/c/dockerlocal/minimax
          bash deploy/gpu-pc/disk_gate.sh c 10
          docker run --rm -v $W:/w -w /w -e HF_HUB_DISABLE_TELEMETRY=1 python:3.11-slim sh -c '
            pip install -q "huggingface_hub>=0.34" 2>/dev/null
            hf download audio-cpp/MiniMax-Music3-GGUF language_model_q4_k.gguf transformer_q4_k.gguf \
              rvq_depth_decoder_q8_0.gguf condition_encoder.gguf vocoder.gguf config.json --local-dir /w
            hf download audio-cpp/MiniMax-Music3-GGUF --include "config/*" "tokenizer/*" --local-dir /w
            [ -e language_model_q4_0.gguf ] || ln -s language_model_q4_k.gguf language_model_q4_0.gguf
            [ -e transformer_q4_0.gguf ] || ln -s transformer_q4_k.gguf transformer_q4_0.gguf
            [ -e rvq_depth_decoder_bf16.gguf ] || ln -s rvq_depth_decoder_q8_0.gguf rvq_depth_decoder_bf16.gguf
            for f in language_model_q4_k transformer_q4_k rvq_depth_decoder_q8_0 condition_encoder vocoder; do
              test -s $f.gguf || { echo "::error::$f.gguf пуст/нет"; exit 1; }
            done
            ls -la /w; du -sh /w'
      - name: Remove volumes
        run: |
          for v in minimax-weights minimax-out; do
            docker volume inspect $v >/dev/null 2>&1 || continue
            docker ps -aq --filter volume=$v | xargs -r docker rm -f
            docker volume rm $v && echo "removed $v"
          done
          docker volume ls --format '{{.Name}}' | grep -E '^minimax-' && { echo "::error::тома остались"; exit 1; } || echo "томов minimax нет"
          docker run --rm -v /run/desktop/mnt/host/d:/d:ro alpine:3.20 df -h /d | tail -1
          docker run --rm -v /run/desktop/mnt/host/c:/c:ro alpine:3.20 df -h /c | tail -1
