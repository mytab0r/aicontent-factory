name: oneoff-ref-style6
on:
  push:
    branches: [exp/ref-style6]
jobs:
  s:
    runs-on: [self-hosted, pc]
    timeout-minutes: 90
    env:
      ACE: http://ace-step:8001
    steps:
      - uses: actions/checkout@v4
      - name: ace-step up
        run: |
          docker start ace-step >/dev/null 2>&1 || true
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ace-step 2>/dev/null)" = healthy ] && exit 0
            sleep 6
          done; exit 1
      - name: refs (90s of each owner reference)
        run: |
          python3 -m venv /tmp/ytv && /tmp/ytv/bin/pip install -q -U yt-dlp
          mkdir -p refs
          # ponytail: YouTube 403 is transient/client-specific; retry alt clients, cache wav on runner
          mkdir -p /tmp/refcache
          for pair in sera:CYZeAfaj3pc panda:SvntC6SZrfA; do n=${pair%%:*}; id=${pair#*:}
            if [ -s /tmp/refcache/$n.wav ]; then cp /tmp/refcache/$n.wav refs/; continue; fi
            for i in 1 2 3; do for c in default android tv web_safari mweb; do
              rm -f refs/raw_$n.*
              /tmp/ytv/bin/yt-dlp -q -f bestaudio --extractor-args "youtube:player_client=$c" -o "refs/raw_$n.%(ext)s" "https://youtu.be/$id" && break 2
              sleep 5
            done; sleep 20; done
            ls refs/raw_$n.* >/dev/null 2>&1 || { echo "ref $n download failed"; exit 1; }
            ffmpeg -loglevel error -y -ss 30 -t 90 -i refs/raw_$n.* -ac 2 -ar 48000 refs/$n.wav
            cp refs/$n.wav /tmp/refcache/
          done; ls -la refs; test -s refs/sera.wav
      - name: generate
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os, time, urllib.request
          B=os.environ["ACE"]
          def post(p,d):
              r=urllib.request.Request(B+p,json.dumps(d).encode(),{"Content-Type":"application/json"})
              return json.load(urllib.request.urlopen(r,timeout=300))
          # Owner 14.10 approved mock-up: instrumental base, short vocal inserts only at transitions.
          P=("instrumental, no vocals, melodic chill bass, dreamy and tender, deep warm sub bass, groovy drums, "
             "rich sound design: plucked synth arps, sparkling bells, music box, soft piano, lush evolving pads, "
             "bright major chords, catchy melodic lead hook, clean polished modern mix, wide stereo")
          PV=("melodic chill bass, dreamy and tender, deep warm sub bass, groovy drums, "
              "airy female vocal chops and soft wordless vocals, sparkling bells, lush synth pads, "
              "bright major chords, catchy melodic hook, clean polished modern mix, wide stereo")
          VOX="[verse]\nooh ooh, aah\n\n[chorus]\nla la la, ooh"
          I="[Instrumental]"
          jobs=[]
          for name,ref,prompt,lyr,dur,seed in [
              ("i1","sera",P,I,210,11),("v1","sera",PV,VOX,40,12),
              ("i2","panda",P,I,210,13),("v2","sera",PV,VOX,40,14),
              ("i3","sera",P,I,210,15),("v3","panda",PV,VOX,40,16),
              ("i4","panda",P,I,190,17)]:
              if os.path.exists(f"refs/{ref}.wav"):
                  jobs.append((name,dict(reference_audio_path=f"refs/{ref}.wav",prompt=prompt,lyrics=lyr,bpm=95,audio_duration=dur,seed=seed)))
          for name,extra in jobs:
              body=dict(prompt=P,lyrics="[Instrumental]",audio_duration=120,bpm=85,key_scale="C major",
                        time_signature="4",batch_size=1,thinking=True,use_random_seed=False,seed=7,
                        audio_format="mp3")
              body.update(extra)
              ref=body.pop("reference_audio_path",None)
              if ref:
                  args=[]
                  for k,v in body.items(): args+=["-F",f"{k}={str(v).lower() if isinstance(v,bool) else v}"]
                  import subprocess
                  o=subprocess.run(["curl","-s","-m","600","-X","POST",B+"/release_task","-F",f"reference_audio=@{ref}"]+args,capture_output=True,text=True).stdout
                  print(o[:300]); tid=json.loads(o)["data"]["task_id"]
              else:
                  tid=post("/release_task",body)["data"]["task_id"]
              t=time.time()
              while True:
                  time.sleep(8); d=post("/query_result",{"task_id_list":[tid]})["data"][0]
                  if d["status"]!=0 or time.time()-t>1500: break
              print(name,"status",d["status"],round(time.time()-t),"s",flush=True)
              if d["status"]==1:
                  f=json.loads(d["result"])[0]["file"]; urllib.request.urlretrieve(B+f,f"out/{name}.mp3")
              else: print(str(d.get("result"))[:300])
          PY
      - name: assemble 15 min
        run: |
          cd out && ls -la
          # vocal inserts: keep the middle 24 s of each 40 s vocal clip
          for v in v1 v2 v3; do ffmpeg -loglevel error -y -i $v.mp3 -af "atrim=8:32,asetpts=N/SR/TB" -ar 48000 -ac 2 $v.cut.wav; done
          # trim leading/trailing silence of every segment: ACE tails left a 1.7 s gap at a crossfade
          T="silenceremove=start_periods=1:start_threshold=-50dB,areverse,silenceremove=start_periods=1:start_threshold=-50dB,areverse"
          for i in i1 i2 i3 i4; do ffmpeg -loglevel error -y -i $i.mp3 -af "$T" -ar 48000 -ac 2 $i.wav; done
          X="acrossfade=d=6:c1=tri:c2=tri"
          ffmpeg -loglevel error -y -i i1.wav -i v1.cut.wav -i i2.wav -i v2.cut.wav -i i3.wav -i v3.cut.wav -i i4.wav \
            -filter_complex "[0][1]$X[a];[a][2]$X[b];[b][3]$X[c];[c][4]$X[d];[d][5]$X[e];[e][6]$X,loudnorm=I=-14:TP=-1.5" \
            -ar 48000 -c:a pcm_s16le raw.wav
          L=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw.wav); echo "len $L"
          ffmpeg -loglevel error -y -i raw.wav -af "afade=t=out:st=$(python3 -c "print($L-8)"):d=8" -c:a libmp3lame -b:a 192k FULL_15min.mp3
          # QC gate: length 840-930 s, no silence >=1 s before last 10 s, true peak < 0 dBFS
          ffmpeg -hide_banner -nostats -i FULL_15min.mp3 -af ebur128=peak=true,silencedetect=n=-50dB:d=1 -f null - 2>qc.txt || true
          python3 - "$L" <<'PY'
          import re,sys
          L=float(sys.argv[1]); t=open("qc.txt").read()
          st=[float(x) for x in re.findall(r"silence_start: ([\d.]+)",t)]
          pk=float(re.findall(r"Peak:\s+(-?[\d.]+) dBFS",t)[-1])
          print("len",L,"silences",st,"peak",pk)
          assert 840<=L<=930, "bad length"
          assert not [x for x in st if x<L-10], "internal silence"
          assert pk<0, "clipping"
          PY
          mkdir -p ../final && mv FULL_15min.mp3 ../final/
      - uses: actions/upload-artifact@v4
        with: {name: ref-style6, path: final/}
